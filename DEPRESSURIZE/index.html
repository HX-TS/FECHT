<html lang="en">

<head>

  >

  <style>

    /* =========================================================
       COLOR SCHEME
    ========================================================= */

    :root {

      --black: #050505;

      --cream: #f2efe9;

      --cream-dark: #e5e0d8;

      --cream-light: #faf8f4;

      --line: #c9c4bc;

      --red: #d71920;

      --red-dark: #a90000;

      --red-light: #ffb3b3;

      --orange: #ff8500;

      --green: #16853e;

      --green-dark: #0a5627;

      --green-soft: #dcefe2;

      --grey: #5d5953;

    }



    /* =========================================================
       RESET
    ========================================================= */

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    html,
    body {

      width: 100%;

      height: 100%;

    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        var(--black);

      color:
        var(--black);

      overflow: hidden;

    }



    /* =========================================================
       PAGE
    ========================================================= */

    .page {

      width: 100%;

      height: 100dvh;

      display: flex;

      flex-direction: column;

      padding: 7px;

      gap: 7px;

      background:
        var(--black);

    }



    /* =========================================================
       HEADER
    ========================================================= */

    .header {

      flex-shrink: 0;

      min-height: 195px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding:
        20px
        20px
        17px;

      background:
        var(--cream);

      border:
        1px solid
        var(--black);

    }



    /* =========================================================
       MAIN TITLE
    ========================================================= */

    .main-title {

      font-size:
        clamp(
          42px,
          6.5vw,
          92px
        );

      line-height: 0.88;

      font-weight: 900;

      letter-spacing: -0.055em;

      text-transform: uppercase;

      color:
        var(--black);

    }


    .subtitle {

      margin-top: 11px;

      font-size:
        clamp(
          8px,
          0.9vw,
          13px
        );

      font-weight: 700;

      letter-spacing: 0.30em;

      text-transform: uppercase;

      color:
        var(--black);

    }



    /* =========================================================
       STATUS BOX
    ========================================================= */

    .status-box {

      margin-top: 18px;

      width:
        min(
          560px,
          92%
        );

      min-height: 47px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      padding:
        10px
        18px;

      border:
        1px solid
        var(--black);

      background:
        var(--cream-dark);

    }



    /* =========================================================
       STATUS DOT
    ========================================================= */

    .status-dot {

      width: 11px;

      height: 11px;

      flex-shrink: 0;

      border-radius: 50%;

      background:
        var(--red);

    }



    /* =========================================================
       STATUS TEXT
    ========================================================= */

    .status-text {

      font-size:
        clamp(
          13px,
          1.3vw,
          19px
        );

      line-height: 1.1;

      font-weight: 900;

      letter-spacing: 0.055em;

      text-transform: uppercase;

    }



    /* =========================================================
       ONGOING DEPRESSURIZATION
    ========================================================= */

    .status-box.ongoing
    .status-dot {

      animation:
        statusDotPulse
        0.85s
        infinite;

    }


    .status-box.ongoing
    .status-text {

      color:
        var(--red);

      animation:
        statusTextPulse
        0.9s
        ease-in-out
        infinite;

    }


    @keyframes statusDotPulse {

      0% {

        background:
          var(--red);

        box-shadow:
          0 0 0 0
          rgba(215, 25, 32, 0.95);

      }


      50% {

        background:
          var(--orange);

        box-shadow:
          0 0 0 10px
          rgba(215, 25, 32, 0);

      }


      100% {

        background:
          var(--red);

        box-shadow:
          0 0 0 0
          rgba(215, 25, 32, 0);

      }

    }


    @keyframes statusTextPulse {

      0% {

        opacity: 1;

        color:
          var(--red);

      }


      50% {

        opacity: 0.45;

        color:
          var(--red-dark);

      }


      100% {

        opacity: 1;

        color:
          var(--red);

      }

    }



    /* =========================================================
       COMPLETE STATUS
    ========================================================= */

    .status-box.complete {

      background:
        var(--green-soft);

      border-color:
        var(--green);

    }


    .status-box.complete
    .status-dot {

      background:
        var(--green);

      box-shadow: none;

      animation: none;

    }


    .status-box.complete
    .status-text {

      color:
        var(--green);

      animation: none;

    }



    /* =========================================================
       LATEST PRESSURE SUMMARY
    ========================================================= */

    .pressure-summary {

      margin-top: 12px;

      display: flex;

      align-items: baseline;

      justify-content: center;

      gap: 9px;

    }


    .pressure-summary-label {

      font-size: 9px;

      font-weight: 800;

      letter-spacing: 0.07em;

      text-transform: uppercase;

      color:
        var(--grey);

    }


    .pressure-summary-value {

      font-size:
        clamp(
          24px,
          2.2vw,
          34px
        );

      line-height: 1;

      font-weight: 900;

      font-variant-numeric:
        tabular-nums;

      color:
        var(--black);

    }


    .pressure-summary-unit {

      font-size: 10px;

      font-weight: 900;

      text-transform: uppercase;

    }



    /* =========================================================
       AUDIO STATUS
    ========================================================= */

    .audio-status {

      margin-top: 7px;

      font-size: 7px;

      font-weight: 800;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      color:
        var(--grey);

    }


    .audio-status.enabled {

        var(--green);

    }

       MAIN DATA PANEL
    ========================================================= */

    .data-panel {

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;

      overflow: hidden;

        var(--cream);

    /* =========================================================

    ========================================================= */

      text-align: center;

    /* =========================================================

    ========================================================= */

    tbody tr.latest-row.ongoing-latest td {

    @keyframes latestRowPulse {

        color:

    ========================================================= */

      justify-content: center;

<body>


  <div class="page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">


      <div class="main-title">

        FEC DEPRESSURIZE

      </div>


      <div class="subtitle">

        TechSmith

      </div>



      <!-- ===================================================
           STATUS
      ==================================================== -->

      <div
        class="status-box ongoing"
        id="statusBox"
      >


        <div class="status-dot"></div>


        <div
          class="status-text"
          id="statusText"
        >

          ONGOING DEPRESSURIZE

        </div>


      </div>



      <!-- ===================================================
           LATEST PRESSURE
      ==================================================== -->

      <div class="pressure-summary">


        <div class="pressure-summary-label">

          Latest Pressure

        </div>


        <div
          class="pressure-summary-value"
          id="latestPressure"
        >

          ---

        </div>


        <div class="pressure-summary-unit">

          BARG

        </div>


      </div>



      <!-- ===================================================
           SOUND STATUS
      ==================================================== -->

      <div
        class="audio-status"
        id="audioStatus"
      >

        TAP / CLICK PAGE ONCE TO ENABLE NEW DATA BEEP

      </div>


    </header>



    <!-- =====================================================
         DATA PANEL
    ====================================================== -->

    <main
      class="data-panel"
      id="dataPanel"
    >


      <div class="panel-header">


        <div class="panel-title">

          DEPRESSURIZATION READING

        </div>


        <div class="refresh-label">

          LIVE UPDATE · 15 SEC

        </div>


      </div>



      <!-- ===================================================
           GOOGLE SHEET DATA
      ==================================================== -->

      <div
        class="table-wrapper"
        id="dataContainer"
      >


        <div class="message">

          Loading Depressurization Data...

        </div>


      </div>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

      Fly TechSmith

    </footer>


  </div>



  <script>


    /* =========================================================
       SETTINGS
    ========================================================= */


    /*
       GOOGLE SHEET REFRESH EVERY 15 SECONDS
    */

    const REFRESH_TIME =
      15000;



    /*
       DEPRESSURIZATION COMPLETE WHEN
       LATEST PRESSURE <= 5 BARG
    */

    const COMPLETE_PRESSURE =
      5;



    /* =========================================================
       GOOGLE SHEET
    ========================================================= */

    const SHEET = {


      spreadsheetId:

        "1Qp-04Fzx6E997Sye8czPoKg4q7T0Zy4qSHtcWWwL2II",


      /*
         FIRST SHEET TAB.

         CHANGE THIS IF YOUR DATA TAB
         USES ANOTHER GID.
      */

      gid:

        "0",


      range:

        "A:Z",


      container:

        "dataContainer",


      callback:

        "depressurizeResponse"


    };



    /* =========================================================
       AUDIO SYSTEM
    ========================================================= */

    let audioContext =
      null;


    let audioUnlocked =
      false;


    /*
       USED TO DETECT NEW LATEST DATA.

       INITIAL LOAD WILL NOT BEEP.
    */

    let previousLatestSignature =
      null;



    /* =========================================================
       UNLOCK AUDIO
    ========================================================= */

    function unlockAudio() {


      try {


        const AudioContextClass =

          window.AudioContext

          ||

          window.webkitAudioContext;



        if (!AudioContextClass) {

          return;

        }



        if (!audioContext) {


          audioContext =

            new AudioContextClass();


        }



        if (
          audioContext.state === "suspended"
        ) {


          audioContext.resume();


        }



        audioUnlocked =
          true;



        const audioStatus =

          document.getElementById(
            "audioStatus"
          );


        audioStatus.textContent =
          "NEW DATA BEEP ENABLED";


        audioStatus.classList.add(
          "enabled"
        );


      }


      catch (error) {


        console.log(
          "Audio unavailable:",
          error
        );


      }


    }



    /* =========================================================
       BROWSER REQUIRES USER INTERACTION
    ========================================================= */

    document.addEventListener(

      "pointerdown",

      unlockAudio,

      {
        once: true
      }

    );


    document.addEventListener(

      "keydown",

      unlockAudio,

      {
        once: true
      }

    );



    /* =========================================================
       CREATE ONE BEEP
    ========================================================= */

    function createBeep(
      frequency,
      startOffset,
      duration
    ) {


      if (

        !audioUnlocked

        ||

        !audioContext

      ) {

        return;

      }



      const startTime =

        audioContext.currentTime

        +

        startOffset;


      const oscillator =

        audioContext.createOscillator();


      const gain =

        audioContext.createGain();



      oscillator.type =
        "sine";


      oscillator.frequency.setValueAtTime(

        frequency,

        startTime

      );


      gain.gain.setValueAtTime(

        0.0001,

        startTime

      );


      gain.gain.exponentialRampToValueAtTime(

        0.30,

        startTime + 0.015

      );


      gain.gain.exponentialRampToValueAtTime(

        0.0001,

        startTime + duration

      );


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.start(
        startTime
      );


      oscillator.stop(
        startTime + duration + 0.02
      );


    }



    /* =========================================================
       NEW DATA DOUBLE BEEP
    ========================================================= */

    function playNewDataBeep() {


      if (

        !audioUnlocked

        ||

        !audioContext

      ) {

        return;

      }



      if (
        audioContext.state === "suspended"
      ) {


        audioContext.resume();


      }



      /* FIRST BEEP */

      createBeep(

        950,

        0,

        0.18

      );



      /* SECOND BEEP */

      createBeep(

        1150,

        0.26,

        0.20

      );


    }



    /* =========================================================
       VISUAL NEW DATA ALERT
    ========================================================= */

    function showNewDataVisualAlert() {


      const panel =

        document.getElementById(
          "dataPanel"
        );


      panel.classList.remove(
        "new-data-alert"
      );


      /*
         FORCE ANIMATION RESET
      */

      void panel.offsetWidth;


      panel.classList.add(
        "new-data-alert"
      );


      setTimeout(

        function () {


          panel.classList.remove(
            "new-data-alert"
          );


        },

        1700

      );


    }



    /* =========================================================
       NORMALIZE TEXT
    ========================================================= */

    function normalizeText(value) {


      return String(
        value || ""
      )

      .trim()

      .toUpperCase();


    }



    /* =========================================================
       CHECK CELL VALUE
    ========================================================= */

    function cellHasValue(cell) {


      if (!cell) {

        return false;

      }


      return !(

        cell.v === null

        ||

        cell.v === undefined

        ||

        cell.v === ""

      );


    }



    /* =========================================================
       GET DISPLAY VALUE
    ========================================================= */

    function getCellDisplayValue(cell) {


      if (!cell) {

        return "";

      }


      if (

        cell.f !== undefined

        &&

        cell.f !== null

      ) {


        return cell.f;


      }


      if (

        cell.v !== undefined

        &&

        cell.v !== null

      ) {


        return cell.v;


      }


      return "";


    }



    /* =========================================================
       EXTRACT NUMBER
    ========================================================= */

    function extractNumber(value) {


      if (

        value === null

        ||

        value === undefined

      ) {

        return null;

      }


      if (
        typeof value === "number"
      ) {

        return value;

      }


      const cleaned =

        String(value)

        .replace(
          /,/g,
          ""
        );


      const match =

        cleaned.match(
          /-?\d+(\.\d+)?/
        );


      if (!match) {

        return null;

      }


      const number =

        parseFloat(
          match[0]
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        return null;

      }


      return number;


    }



    /* =========================================================
       FIND PRESSURE COLUMN
    ========================================================= */

    function findPressureColumn(
      columns
    ) {


      /*
         PRIORITY 1:
         HEADER CONTAINING PRESSURE
      */

      for (
        let i = 0;
        i < columns.length;
        i++
      ) {


        const name =

          normalizeText(
            columns[i].label
          );


        if (
          name.includes(
            "PRESSURE"
          )
        ) {


          return i;


        }


      }



      /*
         PRIORITY 2:
         HEADER CONTAINING BARG
      */

      for (
        let i = 0;
        i < columns.length;
        i++
      ) {


        const name =

          normalizeText(
            columns[i].label
          );


        if (
          name.includes(
            "BARG"
          )
        ) {


          return i;


        }


      }



      /*
         PRIORITY 3:
         COMMON PG NAMES
      */

      for (
        let i = 0;
        i < columns.length;
        i++
      ) {


        const name =

          normalizeText(
            columns[i].label
          );


        if (

          name === "PG"

          ||

          name === "DIGITAL PG"

          ||

          name === "PRESSURE PG"

        ) {


          return i;


        }


      }


      return -1;


    }



    /* =========================================================
       UPDATE STATUS
    ========================================================= */

    function updateStatus(
      pressure
    ) {


      const statusBox =

        document.getElementById(
          "statusBox"
        );


      const statusText =

        document.getElementById(
          "statusText"
        );


      const pressureDisplay =

        document.getElementById(
          "latestPressure"
        );



      /* =======================================================
         NO VALID PRESSURE
      ======================================================= */

      if (

        pressure === null

        ||

        !Number.isFinite(
          pressure
        )

      ) {


        pressureDisplay.textContent =
          "---";


        statusBox.classList.remove(
          "complete"
        );


        statusBox.classList.add(
          "ongoing"
        );


        statusText.textContent =
          "ONGOING DEPRESSURIZE";


        return false;


      }



      /* =======================================================
         DISPLAY PRESSURE
      ======================================================= */

      pressureDisplay.textContent =

        pressure.toFixed(
          2
        );



      /* =======================================================
         COMPLETE AT <= 5 BARG
      ======================================================= */

      if (

        pressure <=
        COMPLETE_PRESSURE

      ) {


        statusBox.classList.remove(
          "ongoing"
        );


        statusBox.classList.add(
          "complete"
        );


        statusText.textContent =
          "DEPRESSURIZATION COMPLETE";


        return true;


      }



      /* =======================================================
         ONGOING
      ======================================================= */

      statusBox.classList.remove(
        "complete"
      );


      statusBox.classList.add(
        "ongoing"
      );


      statusText.textContent =
        "ONGOING DEPRESSURIZE";


      return false;


    }



    /* =========================================================
       LOAD GOOGLE SHEET
    ========================================================= */

    function loadSheet() {


      const query =

        "select * where A is not null";


      const tqx =

        `out:json;responseHandler:${SHEET.callback}`;


      const url =

        "https://docs.google.com/spreadsheets/d/"

        +

        SHEET.spreadsheetId

        +

        "/gviz/tq"

        +

        "?gid="

        +

        SHEET.gid

        +

        "&range="

        +

        encodeURIComponent(
          SHEET.range
        )

        +

        "&headers=1"

        +

        "&tqx="

        +

        encodeURIComponent(
          tqx
        )

        +

        "&tq="

        +

        encodeURIComponent(
          query
        )

        +

        "&_="

        +

        Date.now();



      const script =

        document.createElement(
          "script"
        );


      script.src =
        url;


      script.async =
        true;



      /* =======================================================
         LOAD ERROR
      ======================================================= */

      script.onerror =
        function () {


          const container =

            document.getElementById(
              SHEET.container
            );


          container.innerHTML =

            '<div class="message">' +

            'Unable to Load Google Sheet Data' +

            '</div>';


        };



      /* =======================================================
         REMOVE JSONP SCRIPT
      ======================================================= */

      script.onload =
        function () {


          setTimeout(

            function () {


              if (
                script.parentNode
              ) {


                script.remove();


              }


            },

            1000

          );


        };


      document.head.appendChild(
        script
      );


    }



    /* =========================================================
       SCROLL TO LATEST DATA
    ========================================================= */

    function scrollToLatest(
      container
    ) {


      requestAnimationFrame(

        function () {


          requestAnimationFrame(

            function () {


              container.scrollTop =

                container.scrollHeight

                -

                container.clientHeight;


            }

          );


        }

      );


    }



    /* =========================================================
       CREATE LATEST ROW SIGNATURE
    ========================================================= */

    function createRowSignature(
      row,
      visibleColumns
    ) {


      if (
        !row
        ||
        !row.c
      ) {

        return "";

      }


      return visibleColumns

        .map(

          function (item) {


            return String(

              getCellDisplayValue(

                row.c[
                  item.index
                ]

              )

            );


          }

        )

        .join(
          "|"
        );


    }



    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderTable(
      response
    ) {


      const container =

        document.getElementById(
          SHEET.container
        );


      if (

        !response

        ||

        !response.table

      ) {


        container.innerHTML =

          '<div class="message">' +

          'No Data Available' +

          '</div>';


        return;


      }



      const columns =

        response.table.cols || [];


      const rows =

        response.table.rows || [];



      /* =======================================================
         FIND PRESSURE COLUMN
      ======================================================= */

      const pressureOriginalIndex =

        findPressureColumn(
          columns
        );



      /* =======================================================
         HIDE UNUSED COLUMNS
      ======================================================= */

      const visibleColumns =
        [];


      columns.forEach(

        function (
          column,
          index
        ) {


          const columnName =

            normalizeText(
              column.label
            );


          const hasActualData =

            rows.some(

              function (row) {


                if (!row.c) {

                  return false;

                }


                return cellHasValue(

                  row.c[
                    index
                  ]

                );


              }

            );


          if (

            columnName !== ""

            &&

            hasActualData

          ) {


            visibleColumns.push({


              column:
                column,


              index:
                index


            });


          }


        }

      );



      if (
        visibleColumns.length === 0
      ) {


        container.innerHTML =

          '<div class="message">' +

          'No Reading Available' +

          '</div>';


        return;


      }



      /* =======================================================
         CREATE TABLE
      ======================================================= */

      const table =

        document.createElement(
          "table"
        );


      const thead =

        document.createElement(
          "thead"
        );


      const headerRow =

        document.createElement(
          "tr"
        );


      visibleColumns.forEach(

        function (item) {


          const th =

            document.createElement(
              "th"
            );


          th.textContent =

            item.column.label || "";


          headerRow.appendChild(
            th
          );


        }

      );


      thead.appendChild(
        headerRow
      );


      table.appendChild(
        thead
      );



      /* =======================================================
         TABLE BODY
      ======================================================= */

      const tbody =

        document.createElement(
          "tbody"
        );


      let rowCount =
        0;


      let lastRowElement =
        null;


      let lastValidSourceRow =
        null;


      let latestPressure =
        null;



      rows.forEach(

        function (row) {


          const rowHasData =

            visibleColumns.some(

              function (item) {


                if (!row.c) {

                  return false;

                }


                return cellHasValue(

                  row.c[
                    item.index
                  ]

                );


              }

            );


          if (!rowHasData) {

            return;

          }


          rowCount++;


          const tr =

            document.createElement(
              "tr"
            );


          visibleColumns.forEach(

            function (item) {


              const td =

                document.createElement(
                  "td"
                );


              const cell =

                row.c

                ? row.c[
                    item.index
                  ]

                : null;


              td.textContent =

                getCellDisplayValue(
                  cell
                );


              tr.appendChild(
                td
              );


            }

          );


          tbody.appendChild(
            tr
          );


          lastRowElement =
            tr;


          lastValidSourceRow =
            row;



          /* ===================================================
             LATEST PRESSURE
          =================================================== */

          if (

            pressureOriginalIndex >= 0

            &&

            row.c

          ) {


            const pressureCell =

              row.c[
                pressureOriginalIndex
              ];


            if (
              pressureCell
            ) {


              const pressureSource =

                pressureCell.v !== null

                &&

                pressureCell.v !== undefined

                ? pressureCell.v

                : pressureCell.f;


              const parsedPressure =

                extractNumber(
                  pressureSource
                );


              if (
                parsedPressure !== null
              ) {


                latestPressure =
                  parsedPressure;


              }


            }


          }


        }

      );



      /* =======================================================
         NO DATA
      ======================================================= */

      if (
        rowCount === 0
      ) {


        container.innerHTML =

          '<div class="message">' +

          'No Depressurization Reading Available' +

          '</div>';


        return;


      }



      /* =======================================================
         CHECK IF NEW LATEST DATA EXISTS
      ======================================================= */

      const currentLatestSignature =

        createRowSignature(

          lastValidSourceRow,

          visibleColumns

        );


      if (
        previousLatestSignature === null
      ) {


        /*
           INITIAL LOAD
           DO NOT BEEP
        */

        previousLatestSignature =

          currentLatestSignature;


      }


      else if (

        currentLatestSignature

        !==

        previousLatestSignature

      ) {


        /*
           NEW READING DETECTED
        */

        playNewDataBeep();


        showNewDataVisualAlert();


        previousLatestSignature =

          currentLatestSignature;


      }



      /* =======================================================
         UPDATE STATUS
      ======================================================= */

      const depressurizationComplete =

        updateStatus(
          latestPressure
        );



      /* =======================================================
         LATEST ROW STYLE
      ======================================================= */

      if (
        lastRowElement
      ) {


        lastRowElement.classList.add(
          "latest-row"
        );


        if (
          depressurizationComplete
        ) {


          lastRowElement.classList.add(
            "complete-latest"
          );


        }


        else {


          lastRowElement.classList.add(
            "ongoing-latest"
          );


        }



        /* =====================================================
           EMPHASIZE PRESSURE CELL
        ===================================================== */

        if (
          pressureOriginalIndex >= 0
        ) {


          const visiblePressurePosition =

            visibleColumns.findIndex(

              function (item) {


                return (

                  item.index ===
                  pressureOriginalIndex

                );


              }

            );


          if (
            visiblePressurePosition >= 0
          ) {


            const pressureCellElement =

              lastRowElement.children[
                visiblePressurePosition
              ];


            if (
              pressureCellElement
            ) {


              pressureCellElement.classList.add(
                "latest-pressure"
              );


            }


          }


        }


      }



      /* =======================================================
         DISPLAY TABLE
      ======================================================= */

      table.appendChild(
        tbody
      );


      container.innerHTML =
        "";


      container.appendChild(
        table
      );



      /* =======================================================
         SHOW LATEST DATA
      ======================================================= */

      scrollToLatest(
        container
      );


    }



    /* =========================================================
       GOOGLE CALLBACK
    ========================================================= */

    window.depressurizeResponse =

      function (response) {


        renderTable(
          response
        );


      };



    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    loadSheet();



    /* =========================================================
       AUTO REFRESH EVERY 15 SECONDS
    ========================================================= */

    setInterval(

      loadSheet,

      REFRESH_TIME

    );


  </script>
