<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>FEC Hydrotest Instrument Update</title>

  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    :root {
      --black: #050505;
      --cream: #f2efe9;
      --cream-2: #ebe8e2;
      --line: #cbc7bf;

      --datetime-width: 150px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: var(--black);

      color: var(--black);

      overflow: hidden;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      background: var(--black);

      padding: 7px;

      gap: 7px;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      flex-shrink: 0;

      height: clamp(120px, 20vh, 220px);

      background: var(--cream);

      border: 1px solid var(--black);

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      overflow: hidden;

      padding: 10px 20px;
    }


    .hero-title {
      font-size: clamp(34px, 6vw, 90px);

      font-weight: 900;

      line-height: 0.84;

      letter-spacing: -0.05em;

      text-transform: uppercase;

      color: var(--black);
    }


    .hero-title span {
      display: block;
    }


    .hero-subtitle {
      margin-top: clamp(9px, 1.5vh, 18px);

      font-size: clamp(8px, 1vw, 14px);

      font-weight: 700;

      letter-spacing: 0.32em;
    }


    /* =========================================================
       DASHBOARD
    ========================================================= */

    .dashboard {
      flex: 1;

      min-height: 0;

      display: grid;

      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 7px;
    }


    /* =========================================================
       READING PANEL
    ========================================================= */

    .reading-panel {
      min-height: 0;

      display: flex;
      flex-direction: column;

      background: var(--cream);

      border: 1px solid var(--black);

      overflow: hidden;
    }


    /* =========================================================
       PANEL TITLE
    ========================================================= */

    .panel-title {
      flex-shrink: 0;

      min-height: 42px;

      display: flex;

      align-items: center;
      justify-content: flex-start;

      padding: 0 16px;

      border-bottom: 1px solid var(--line);

      background: var(--cream);

      color: var(--black);

      font-size: 13px;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 0.03em;
    }


    /* =========================================================
       TABLE WRAPPER
    ========================================================= */

    .table-wrapper {
      flex: 1;

      min-height: 0;

      overflow: auto;

      background: var(--cream);

      scrollbar-width: thin;

      scrollbar-color:
        #888
        var(--cream-2);
    }


    .table-wrapper::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }


    .table-wrapper::-webkit-scrollbar-track {
      background: var(--cream-2);
    }


    .table-wrapper::-webkit-scrollbar-thumb {
      background: #888;
    }


    /* =========================================================
       TABLE
    ========================================================= */

    table {
      width: 100%;

      border-collapse: collapse;

      table-layout: auto;

      background: var(--cream);

      color: var(--black);

      font-size: 13px;
    }


    /* =========================================================
       TABLE HEADER
    ========================================================= */

    thead {
      position: sticky;

      top: 0;

      z-index: 10;
    }


    th {
      min-width: 125px;

      height: 50px;

      padding: 8px 12px;

      background: var(--cream);

      color: var(--black);

      border-right: 1px solid var(--line);

      border-bottom: 1px solid var(--black);

      text-align: left;

      vertical-align: middle;

      font-size: 11px;

      font-weight: 900;

      text-transform: uppercase;

      line-height: 1.2;
    }


    th:last-child {
      border-right: none;
    }


    /* =========================================================
       TABLE DATA
    ========================================================= */

    td {
      min-width: 125px;

      height: 38px;

      padding: 7px 12px;

      background: var(--cream);

      color: var(--black);

      border-right: 1px solid var(--line);

      border-bottom: 1px solid var(--line);

      text-align: left;

      vertical-align: middle;

      white-space: nowrap;

      font-size: 12px;

      font-weight: 600;
    }


    td:last-child {
      border-right: none;
    }


    tbody tr:hover td {
      background: #e9e5de;
    }


    /* =========================================================
       TIMESTAMP / DATE / TIME

       SAME WIDTH FOR GPS AND GPP4
    ========================================================= */

    th:nth-child(1),
    td:nth-child(1),

    th:nth-child(2),
    td:nth-child(2),

    th:nth-child(3),
    td:nth-child(3) {

      width: var(--datetime-width);

      min-width: var(--datetime-width);

      max-width: var(--datetime-width);
    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    .message {
      width: 100%;

      height: 100%;

      min-height: 80px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: var(--cream);

      color: var(--black);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.03em;

      text-transform: uppercase;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      flex-shrink: 0;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: var(--cream);

      border: 1px solid var(--black);

      overflow: hidden;
    }


    /* =========================================================
       FLY TECHSMITH
    ========================================================= */

    .footer-text {
      width: 100%;

      min-height: 32px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 6px 10px;

      color: var(--black);

      font-size: 10px;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 0.08em;

      border-bottom: 1px solid var(--line);
    }


    /* =========================================================
       FOOTER IMAGE
    ========================================================= */

    .footer-image-link {
      display: block;

      width: 100%;

      line-height: 0;

      text-decoration: none;

      background: var(--cream);
    }


    .footer-image {
      display: block;

      width: 100%;

      height: 90px;

      object-fit: cover;

      object-position: center;

      border: 0;
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 900px) {

      :root {
        --datetime-width: 135px;
      }


      .page {
        padding: 5px;

        gap: 5px;
      }


      .dashboard {
        gap: 5px;
      }


      .hero {
        height: clamp(110px, 18vh, 175px);
      }


      .hero-title {
        font-size: clamp(31px, 7vw, 65px);
      }


      .panel-title {
        min-height: 36px;

        padding: 0 12px;

        font-size: 11px;
      }


      th {
        min-width: 115px;

        height: 43px;

        padding: 7px 9px;

        font-size: 10px;
      }


      td {
        min-width: 115px;

        height: 33px;

        padding: 6px 9px;

        font-size: 11px;
      }


      .footer-text {
        min-height: 28px;

        font-size: 9px;
      }


      .footer-image {
        height: 75px;
      }

    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      :root {
        --datetime-width: 115px;
      }


      .page {
        padding:
          max(3px, env(safe-area-inset-top))
          3px
          max(3px, env(safe-area-inset-bottom));

        gap: 3px;
      }


      .hero {
        height: 95px;

        padding: 7px 10px;
      }


      .hero-title {
        font-size: clamp(26px, 9vw, 41px);

        line-height: 0.88;
      }


      .hero-subtitle {
        margin-top: 7px;

        font-size: 7px;

        letter-spacing: 0.28em;
      }


      .dashboard {
        gap: 3px;
      }


      .panel-title {
        min-height: 30px;

        padding: 0 9px;

        font-size: 10px;
      }


      th {
        min-width: 100px;

        height: 39px;

        padding: 6px 7px;

        font-size: 9px;
      }


      td {
        min-width: 100px;

        height: 29px;

        padding: 5px 7px;

        font-size: 10px;
      }


      .footer-text {
        min-height: 24px;

        padding: 4px 8px;

        font-size: 8px;
      }


      .footer-image {
        height: 55px;
      }

    }


    /* =========================================================
       LANDSCAPE PHONE / SHORT SCREEN
    ========================================================= */

    @media (max-height: 600px) {

      .hero {
        height: 70px;
      }


      .hero-title {
        font-size: clamp(22px, 5vw, 40px);
      }


      .hero-title span {
        display: inline;
      }


      .hero-title span + span::before {
        content: " ";
      }


      .hero-subtitle {
        margin-top: 4px;
      }


      .panel-title {
        min-height: 24px;

        font-size: 9px;
      }


      th {
        height: 30px;

        padding: 4px 7px;
      }


      td {
        height: 24px;

        padding: 3px 7px;
      }


      .footer-text {
        min-height: 19px;

        padding: 3px;

        font-size: 7px;
      }


      .footer-image {
        height: 38px;
      }

    }

  </style>
</head>


<body>


  <div class="page">


    <!-- =====================================================
         MAIN HEADER
    ====================================================== -->

    <header class="hero">

      <div class="hero-title">

        <span>FEC HYDROTEST</span>

        <span>INSTRUMENT UPDATE</span>

      </div>


      <div class="hero-subtitle">
        TechSmith
      </div>

    </header>



    <!-- =====================================================
         DASHBOARD
    ====================================================== -->

    <main class="dashboard">


      <!-- ===================================================
           GPS READING
      ==================================================== -->

      <section class="reading-panel">


        <div class="panel-title">
          GPS READING
        </div>


        <div
          class="table-wrapper"
          id="gpsContainer"
        >

          <div class="message">
            Loading GPS Data...
          </div>

        </div>


      </section>



      <!-- ===================================================
           GPP4 READING
      ==================================================== -->

      <section class="reading-panel">


        <div class="panel-title">
          GPP4 READING
        </div>


        <div
          class="table-wrapper"
          id="gpp4Container"
        >

          <div class="message">
            Loading GPP4 Data...
          </div>

        </div>


      </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">


      <div class="footer-text">
        Fly TechSmith
      </div>


      <a
        class="footer-image-link"
        href="https://ibb.co/mCTT4v14"
        target="_blank"
        rel="noopener noreferrer"
      >

        <img
          class="footer-image"
          src="https://i.ibb.co/zhxxZ8jZ/DESIGN-1.jpg"
          alt="TechSmith Design"
        >

      </a>


    </footer>


  </div>



  <script>

    /* =========================================================
       SETTINGS
    ========================================================= */

    const REFRESH_TIME = 60000;



    /* =========================================================
       GPS CONFIGURATION
    ========================================================= */

    const GPS = {

      spreadsheetId:
        "1OucgLhFiTqkeWiXJ0aI7j_tMsu9lVnqTxSK8y2AMCn4",

      gid:
        "1148130591",

      range:
        "A:Z",

      container:
        "gpsContainer",

      callback:
        "gpsResponse",

      /*
        These columns will NOT be displayed
        on the GPS dashboard.
      */

      hiddenColumns: [
        "INPUT"
      ]

    };



    /* =========================================================
       GPP4 CONFIGURATION
    ========================================================= */

    const GPP4 = {

      spreadsheetId:
        "1MKLNtFUQT8GiiVmyoXSkQjw7oPF2z44MO8gdCIUo5t0",

      /*
        If your actual GPP4 response sheet
        has another GID, change this value.
      */

      gid:
        "0",

      range:
        "A:Z",

      container:
        "gpp4Container",

      callback:
        "gpp4Response",

      hiddenColumns: []

    };



    /* =========================================================
       LOAD GOOGLE SHEET
    ========================================================= */

    function loadSheet(config) {

      /*
        Only rows where Column A / Timestamp
        contains data are returned.

        This removes blank rows.
      */

      const query =
        "select * where A is not null";


      const tqx =
        `out:json;responseHandler:${config.callback}`;


      const url =

        "https://docs.google.com/spreadsheets/d/" +

        config.spreadsheetId +

        "/gviz/tq" +

        "?gid=" +
        config.gid +

        "&range=" +
        encodeURIComponent(config.range) +

        "&headers=1" +

        "&tqx=" +
        encodeURIComponent(tqx) +

        "&tq=" +
        encodeURIComponent(query) +

        "&_=" +
        Date.now();



      /*
        Create JSONP script.

        No external JS library required.
      */

      const script =
        document.createElement("script");


      script.src =
        url;


      script.async =
        true;



      /* =======================================================
         ERROR
      ======================================================= */

      script.onerror =
        function () {

          const container =
            document.getElementById(
              config.container
            );


          container.innerHTML =

            '<div class="message">' +

            'Unable to load Google Sheet data' +

            '</div>';

        };



      /* =======================================================
         REMOVE SCRIPT AFTER LOAD
      ======================================================= */

      script.onload =
        function () {

          setTimeout(
            function () {

              if (
                script.parentNode
              ) {

                script.remove();

              }

            },

            1000

          );

        };


      document.head.appendChild(
        script
      );

    }



    /* =========================================================
       CHECK IF CELL HAS VALUE
    ========================================================= */

    function cellHasValue(cell) {

      if (!cell) {
        return false;
      }


      return !(
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ""
      );

    }



    /* =========================================================
       GET GOOGLE SHEET DISPLAY VALUE
    ========================================================= */

    function getCellDisplayValue(cell) {

      if (!cell) {
        return "";
      }


      /*
        Use Google's formatted value first.

        This keeps:
        - date formatting
        - time formatting
        - decimal formatting
      */

      if (
        cell.f !== undefined &&
        cell.f !== null
      ) {

        return cell.f;

      }


      if (
        cell.v !== undefined &&
        cell.v !== null
      ) {

        return cell.v;

      }


      return "";

    }



    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderTable(
      response,
      config
    ) {


      const container =
        document.getElementById(
          config.container
        );


      if (
        !response ||
        !response.table
      ) {

        container.innerHTML =

          '<div class="message">' +

          'No data available' +

          '</div>';


        return;

      }



      const columns =
        response.table.cols || [];


      const rows =
        response.table.rows || [];



      /* =======================================================
         PREPARE HIDDEN COLUMNS
      ======================================================= */

      const hiddenColumns =

        (config.hiddenColumns || [])

          .map(
            function (name) {

              return String(name)
                .trim()
                .toUpperCase();

            }
          );



      /* =======================================================
         FIND VISIBLE COLUMNS
      ======================================================= */

      const visibleColumns =
        [];


      columns.forEach(

        function (
          column,
          index
        ) {


          const columnName =

            String(
              column.label || ""
            )

              .trim()

              .toUpperCase();



          /* ---------------------------------------------------
             HIDE COLUMNS SUCH AS GPS INPUT
          --------------------------------------------------- */

          if (
            hiddenColumns.includes(
              columnName
            )
          ) {

            return;

          }



          /* ---------------------------------------------------
             CHECK COLUMN DATA
          --------------------------------------------------- */

          const hasData =

            rows.some(

              function (row) {


                if (!row.c) {
                  return false;
                }


                return cellHasValue(
                  row.c[index]
                );

              }

            );



          /* ---------------------------------------------------
             REMOVE COMPLETELY EMPTY COLUMNS
          --------------------------------------------------- */

          if (
            columnName !== "" ||
            hasData
          ) {

            visibleColumns.push({

              column:
                column,

              index:
                index

            });

          }

        }

      );



      /* =======================================================
         NO COLUMNS
      ======================================================= */

      if (
        visibleColumns.length === 0
      ) {

        container.innerHTML =

          '<div class="message">' +

          'No data available' +

          '</div>';


        return;

      }



      /* =======================================================
         CREATE TABLE
      ======================================================= */

      const table =
        document.createElement(
          "table"
        );



      /* =======================================================
         HEADER
      ======================================================= */

      const thead =
        document.createElement(
          "thead"
        );


      const headerRow =
        document.createElement(
          "tr"
        );


      visibleColumns.forEach(

        function (item) {


          const th =
            document.createElement(
              "th"
            );


          th.textContent =
            item.column.label || "";


          headerRow.appendChild(
            th
          );

        }

      );


      thead.appendChild(
        headerRow
      );


      table.appendChild(
        thead
      );



      /* =======================================================
         TABLE BODY
      ======================================================= */

      const tbody =
        document.createElement(
          "tbody"
        );


      let rowCount =
        0;



      rows.forEach(

        function (row) {


          /* ---------------------------------------------------
             IGNORE EMPTY ROWS
          --------------------------------------------------- */

          const hasData =

            visibleColumns.some(

              function (item) {


                if (!row.c) {
                  return false;
                }


                return cellHasValue(
                  row.c[item.index]
                );

              }

            );


          if (!hasData) {
            return;
          }



          rowCount++;



          /* ---------------------------------------------------
             CREATE ROW
          --------------------------------------------------- */

          const tr =
            document.createElement(
              "tr"
            );



          /* ---------------------------------------------------
             CREATE CELLS
          --------------------------------------------------- */

          visibleColumns.forEach(

            function (item) {


              const td =
                document.createElement(
                  "td"
                );


              const cell =

                row.c

                  ? row.c[
                      item.index
                    ]

                  : null;



              td.textContent =

                getCellDisplayValue(
                  cell
                );


              tr.appendChild(
                td
              );

            }

          );


          tbody.appendChild(
            tr
          );

        }

      );



      /* =======================================================
         NO READINGS
      ======================================================= */

      if (
        rowCount === 0
      ) {

        container.innerHTML =

          '<div class="message">' +

          'No readings available yet' +

          '</div>';


        return;

      }



      /* =======================================================
         ADD BODY TO TABLE
      ======================================================= */

      table.appendChild(
        tbody
      );



      /* =======================================================
         DISPLAY TABLE
      ======================================================= */

      container.innerHTML =
        "";


      container.appendChild(
        table
      );

    }



    /* =========================================================
       GPS CALLBACK
    ========================================================= */

    window.gpsResponse =
      function (response) {

        renderTable(
          response,
          GPS
        );

      };



    /* =========================================================
       GPP4 CALLBACK
    ========================================================= */

    window.gpp4Response =
      function (response) {

        renderTable(
          response,
          GPP4
        );

      };



    /* =========================================================
       REFRESH BOTH SHEETS
    ========================================================= */

    function refreshAll() {

      loadSheet(
        GPS
      );


      loadSheet(
        GPP4
      );

    }



    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    refreshAll();



    /* =========================================================
       AUTO REFRESH EVERY 60 SECONDS
    ========================================================= */

    setInterval(

      refreshAll,

      REFRESH_TIME

    );

  </script>


</body>

</html>
