<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>FEC Hydrotest Live Dashboard</title>


  <!-- =========================================================
       FAVICON
  ========================================================= -->

  <link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/gbgLwSqg/Chat-GPT-Image-Jul-26-2026-04-53-23-AM-2.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="https://i.ibb.co/gbgLwSqg/Chat-GPT-Image-Jul-26-2026-04-53-23-AM-2.png"
  >

  <link
    rel="apple-touch-icon"
    href="https://i.ibb.co/gbgLwSqg/Chat-GPT-Image-Jul-26-2026-04-53-23-AM-2.png"
  >


  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    :root {

      --black: #050505;

      --cream: #f2efe9;

      --cream-2: #ebe8e2;

      --line: #cbc7bf;

      --datetime-width: 150px;

    }


    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    html,
    body {

      width: 100%;

      height: 100%;

    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: var(--black);

      color: var(--black);

      overflow: hidden;

    }



    /* =========================================================
       PAGE
    ========================================================= */

    .page {

      width: 100%;

      height: 100dvh;

      display: flex;

      flex-direction: column;

      background: var(--black);

      padding: 7px;

      gap: 7px;

    }



    /* =========================================================
       HEADER
    ========================================================= */

    .hero {

      flex-shrink: 0;

      min-height: 150px;

      height:
        clamp(
          150px,
          20vh,
          220px
        );

      background: var(--cream);

      border:
        1px solid
        var(--black);

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        auto;

      align-items: stretch;

      overflow: hidden;

    }



    /* =========================================================
       HEADER LEFT
    ========================================================= */

    .hero-left {

      min-width: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: flex-start;

      padding:
        20px
        30px;

    }


    .hero-title {

      font-size:
        clamp(
          34px,
          5vw,
          82px
        );

      font-weight: 900;

      line-height: 0.88;

      letter-spacing: -0.05em;

      text-transform: uppercase;

      text-align: left;

      color: var(--black);

    }


    .hero-title span {

      display: block;

    }


    .hero-subtitle {

      margin-top: 14px;

      font-size:
        clamp(
          8px,
          0.9vw,
          13px
        );

      font-weight: 700;

      letter-spacing: 0.30em;

      text-align: left;

    }



    /* =========================================================
       HYDROTEST HOLDING TIMER PANEL
    ========================================================= */

    .hold-panel {

      width:
        clamp(
          300px,
          29vw,
          470px
        );

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding:
        16px
        24px;

      border-left:
        1px solid
        var(--black);

      background: var(--cream);

    }



    /* =========================================================
       HOLD TITLE
    ========================================================= */

    .hold-title-row {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 12px;

    }


    .live-dot {

      width: 8px;

      height: 8px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #ff1717;

      box-shadow:
        0 0 0 0
        rgba(255, 23, 23, 0.8);

      animation:
        livePulse
        1.2s
        infinite;

    }


    @keyframes livePulse {

      0% {

        background: #ff1717;

        box-shadow:
          0 0 0 0
          rgba(255, 23, 23, 0.8);

      }

      50% {

        background: #ff8a00;

        box-shadow:
          0 0 0 8px
          rgba(255, 23, 23, 0);

      }

      100% {

        background: #ff1717;

        box-shadow:
          0 0 0 0
          rgba(255, 23, 23, 0);

      }

    }


    .hold-panel-title {

      font-size: 11px;

      font-weight: 900;

      letter-spacing: 0.08em;

      text-transform: uppercase;

    }



    /* =========================================================
       TIMER GRID
    ========================================================= */

    .timer-grid {

      display: grid;

      grid-template-columns:
        1fr
        auto;

      column-gap: 18px;

      row-gap: 7px;

      align-items: center;

    }


    .timer-label {

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 0.06em;

      text-transform: uppercase;

      color: #55514b;

    }


    .timer-value {

      min-width: 105px;

      text-align: right;

      font-size: 17px;

      line-height: 1;

      font-weight: 900;

      font-variant-numeric:
        tabular-nums;

      letter-spacing: 0.04em;

      color: var(--black);

    }



    /* =========================================================
       TIMER BLINKING COLOR
    ========================================================= */

    .timer-value.live {

      animation:
        timerBlink
        1.3s
        ease-in-out
        infinite;

    }


    @keyframes timerBlink {

      0% {

        color: #050505;

      }

      50% {

        color: #d71920;

      }

      100% {

        color: #050505;

      }

    }



    /* =========================================================
       TIMER DIVIDER
    ========================================================= */

    .timer-divider {

      grid-column:
        1 / -1;

      height: 1px;

      margin:
        2px
        0;

      background: var(--line);

    }



    /* =========================================================
       START / COMPLETION DETAILS
    ========================================================= */

    .timer-note {

      margin-top: 12px;

      padding-top: 8px;

      border-top:
        1px solid
        var(--line);

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 10px;

    }


    .timer-note-item {

      font-size: 8px;

      line-height: 1.4;

      color: #55514b;

      text-transform: uppercase;

    }


    .timer-note-item strong {

      display: block;

      margin-top: 2px;

      font-size: 9px;

      color: var(--black);

    }


    .timer-note-item:last-child {

      text-align: right;

    }



    /* =========================================================
       COMPLETED STATUS
    ========================================================= */

    .hold-panel.completed
    .live-dot {

      background: #16853e;

      animation: none;

      box-shadow: none;

    }


    .hold-panel.completed
    .timer-value.live {

      color: #16853e;

      animation: none;

    }



    /* =========================================================
       DASHBOARD
    ========================================================= */

    .dashboard {

      flex: 1;

      min-height: 0;

      display: grid;

      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 7px;

    }



    /* =========================================================
       READING PANEL
    ========================================================= */

    .reading-panel {

      min-height: 0;

      display: flex;

      flex-direction: column;

      background: var(--cream);

      border:
        1px solid
        var(--black);

      overflow: hidden;

    }



    /* =========================================================
       PANEL TITLE
    ========================================================= */

    .panel-title {

      flex-shrink: 0;

      min-height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        0
        16px;

      border-bottom:
        1px solid
        var(--line);

      background: var(--cream);

      color: var(--black);

      text-align: center;

      font-size: 13px;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 0.03em;

    }



    /* =========================================================
       TABLE WINDOW
    ========================================================= */

    .table-wrapper {

      flex: 1;

      min-height: 0;

      overflow-x: auto;

      overflow-y: auto;

      background: var(--cream);

      scrollbar-width: thin;

      scrollbar-color:
        #888
        var(--cream-2);

      scroll-behavior: auto;

    }


    .table-wrapper::-webkit-scrollbar {

      width: 8px;

      height: 8px;

    }


    .table-wrapper::-webkit-scrollbar-track {

      background: var(--cream-2);

    }


    .table-wrapper::-webkit-scrollbar-thumb {

      background: #888;

    }



    /* =========================================================
       TABLE
    ========================================================= */

    table {

      width: 100%;

      border-collapse: collapse;

      table-layout: auto;

      background: var(--cream);

      color: var(--black);

      font-size: 13px;

    }



    /* =========================================================
       TABLE HEADER
    ========================================================= */

    thead {

      position: sticky;

      top: 0;

      z-index: 10;

    }


    th {

      min-width: 125px;

      height: 50px;

      padding:
        8px
        12px;

      background: var(--cream);

      color: var(--black);

      border-right:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--black);

      text-align: center;

      vertical-align: middle;

      font-size: 11px;

      font-weight: 900;

      text-transform: uppercase;

      line-height: 1.2;

    }


    th:last-child {

      border-right: none;

    }



    /* =========================================================
       TABLE DATA
       ALL CENTER
    ========================================================= */

    td {

      min-width: 125px;

      height: 38px;

      padding:
        7px
        12px;

      background: var(--cream);

      color: var(--black);

      border-right:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--line);

      text-align: center;

      vertical-align: middle;

      white-space: nowrap;

      font-size: 12px;

      font-weight: 600;

    }


    td:last-child {

      border-right: none;

    }


    tbody tr:hover td {

      background: #e9e5de;

    }



    /* =========================================================
       LATEST READING
    ========================================================= */

    tbody tr.latest-row td {

      font-weight: 900;

      border-top:
        2px solid
        var(--black);

      background: #e7e3dc;

    }



    /* =========================================================
       TIMESTAMP / DATE / TIME
       SAME WIDTH FOR GPS & GPP4
    ========================================================= */

    th:nth-child(1),
    td:nth-child(1),

    th:nth-child(2),
    td:nth-child(2),

    th:nth-child(3),
    td:nth-child(3) {

      width:
        var(--datetime-width);

      min-width:
        var(--datetime-width);

      max-width:
        var(--datetime-width);

    }



    /* =========================================================
       MESSAGE
    ========================================================= */

    .message {

      width: 100%;

      height: 100%;

      min-height: 80px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background: var(--cream);

      color: var(--black);

      text-align: center;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.03em;

      text-transform: uppercase;

    }



    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {

      flex-shrink: 0;

      min-height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        7px
        10px
        max(
          7px,
          env(safe-area-inset-bottom)
        );

      background: var(--cream);

      border:
        1px solid
        var(--black);

      color: var(--black);

      text-align: center;

      font-size: 10px;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 0.08em;

    }



    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 900px) {


      :root {

        --datetime-width: 135px;

      }


      .page {

        padding: 5px;

        gap: 5px;

      }


      .hero {

        min-height: 135px;

        height: 18vh;

      }


      .hero-left {

        padding:
          15px
          18px;

      }


      .hero-title {

        font-size:
          clamp(
            29px,
            6vw,
            58px
          );

      }


      .hold-panel {

        width: 310px;

        padding:
          12px
          15px;

      }


      .timer-value {

        font-size: 15px;

      }


      .dashboard {

        gap: 5px;

      }


      .panel-title {

        min-height: 36px;

        font-size: 11px;

      }


      th {

        min-width: 115px;

        height: 43px;

        padding:
          7px
          9px;

        font-size: 10px;

      }


      td {

        min-width: 115px;

        height: 33px;

        padding:
          6px
          9px;

        font-size: 11px;

      }


      .footer {

        min-height: 32px;

        font-size: 9px;

      }

    }



    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {


      :root {

        --datetime-width: 115px;

      }


      .page {

        padding:
          max(
            3px,
            env(safe-area-inset-top)
          )
          3px
          max(
            3px,
            env(safe-area-inset-bottom)
          );

        gap: 3px;

      }


      .hero {

        min-height: 115px;

        height: 115px;

        grid-template-columns:
          minmax(0, 1fr)
          175px;

      }


      .hero-left {

        padding:
          10px
          9px;

      }


      .hero-title {

        font-size:
          clamp(
            19px,
            6.1vw,
            29px
          );

        line-height: 0.90;

      }


      .hero-subtitle {

        margin-top: 7px;

        font-size: 6px;

        letter-spacing: 0.22em;

      }


      .hold-panel {

        width: 175px;

        padding:
          8px
          8px;

      }


      .hold-title-row {

        gap: 5px;

        margin-bottom: 7px;

      }


      .live-dot {

        width: 6px;

        height: 6px;

      }


      .hold-panel-title {

        font-size: 7px;

        letter-spacing: 0.04em;

      }


      .timer-grid {

        column-gap: 6px;

        row-gap: 4px;

      }


      .timer-label {

        font-size: 6px;

        letter-spacing: 0.02em;

      }


      .timer-value {

        min-width: 68px;

        font-size: 11px;

      }


      .timer-note {

        margin-top: 7px;

        padding-top: 5px;

        gap: 4px;

      }


      .timer-note-item {

        font-size: 5px;

      }


      .timer-note-item strong {

        font-size: 6px;

      }


      .dashboard {

        gap: 3px;

      }


      .panel-title {

        min-height: 30px;

        font-size: 10px;

      }


      th {

        min-width: 100px;

        height: 39px;

        padding:
          6px
          7px;

        font-size: 9px;

      }


      td {

        min-width: 100px;

        height: 29px;

        padding:
          5px
          7px;

        font-size: 10px;

      }


      .footer {

        min-height: 26px;

        padding:
          4px
          8px;

        font-size: 8px;

      }

    }



    /* =========================================================
       LANDSCAPE / SHORT SCREEN
    ========================================================= */

    @media (max-height: 600px) {


      .hero {

        min-height: 85px;

        height: 85px;

      }


      .hero-left {

        padding:
          7px
          13px;

      }


      .hero-title {

        font-size:
          clamp(
            20px,
            4.5vw,
            39px
          );

      }


      .hero-title span {

        display: inline;

      }


      .hero-title
      span + span::before {

        content: " ";

      }


      .hero-subtitle {

        margin-top: 4px;

      }


      .hold-panel {

        padding:
          6px
          12px;

      }


      .hold-title-row {

        margin-bottom: 5px;

      }


      .timer-grid {

        row-gap: 3px;

      }


      .timer-note {

        margin-top: 5px;

        padding-top: 4px;

      }


      .panel-title {

        min-height: 24px;

        font-size: 9px;

      }


      th {

        height: 30px;

        padding:
          4px
          7px;

      }


      td {

        height: 24px;

        padding:
          3px
          7px;

      }


      .footer {

        min-height: 22px;

        padding: 3px;

        font-size: 7px;

      }

    }

  </style>

</head>



<body>


  <div class="page">



    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="hero">



      <!-- ===================================================
           HEADER LEFT
      ==================================================== -->

      <div class="hero-left">


        <div class="hero-title">

          <span>
            FEC HYDROTEST
          </span>

          <span>
            INSTRUMENT UPDATE
          </span>

        </div>


        <div class="hero-subtitle">

          TechSmith

        </div>


      </div>



      <!-- ===================================================
           HYDROTEST HOLDING PERIOD
      ==================================================== -->

      <div
        class="hold-panel"
        id="holdPanel"
      >


        <div class="hold-title-row">


          <div
            class="live-dot"
          ></div>


          <div
            class="hold-panel-title"
            id="holdStatusTitle"
          >

            Hydrotest Holding Period

          </div>


        </div>



        <div class="timer-grid">


          <div class="timer-label">

            Holding Time

          </div>


          <div
            class="timer-value live"
            id="holdingTime"
          >

            00:00:00

          </div>



          <div class="timer-divider"></div>



          <div class="timer-label">

            Remaining Hrs

          </div>


          <div
            class="timer-value"
            id="remainingTime"
          >

            24:00:00

          </div>


        </div>



        <div class="timer-note">


          <div class="timer-note-item">

            Start

            <strong>

              21:30 HRS

              <br>

              21/8/2026

            </strong>

          </div>



          <div class="timer-note-item">

            Completion

            <strong>

              21:30 HRS

              <br>

              22/8/2026

            </strong>

          </div>


        </div>


      </div>


    </header>



    <!-- =====================================================
         DASHBOARD
    ====================================================== -->

    <main class="dashboard">



      <!-- ===================================================
           GPS READING
      ==================================================== -->

      <section class="reading-panel">


        <div class="panel-title">

          GPS READING

        </div>


        <div
          class="table-wrapper"
          id="gpsContainer"
        >


          <div class="message">

            Loading GPS Data...

          </div>


        </div>


      </section>



      <!-- ===================================================
           GPP4 READING
      ==================================================== -->

      <section class="reading-panel">


        <div class="panel-title">

          GPP4 READING

        </div>


        <div
          class="table-wrapper"
          id="gpp4Container"
        >


          <div class="message">

            Loading GPP4 Data...

          </div>


        </div>


      </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

      Fly TechSmith

    </footer>


  </div>



  <script>


    /* =========================================================
       HYDROTEST HOLDING PERIOD

       MALAYSIA TIME UTC +08:00

       START:
       21/08/2026 21:30:00

       COMPLETION:
       22/08/2026 21:30:00
    ========================================================= */


    const HOLD_START =
      new Date(
        "2026-08-21T21:30:00+08:00"
      );


    const HOLD_END =
      new Date(
        "2026-08-22T21:30:00+08:00"
      );


    const TOTAL_HOLD_MS =

      HOLD_END.getTime()

      -

      HOLD_START.getTime();



    /* =========================================================
       FORMAT TIME
       HH:MM:SS
    ========================================================= */

    function formatDuration(ms) {


      ms =
        Math.max(
          0,
          ms
        );


      const totalSeconds =
        Math.floor(
          ms / 1000
        );


      const hours =
        Math.floor(
          totalSeconds / 3600
        );


      const minutes =
        Math.floor(
          (
            totalSeconds % 3600
          )
          / 60
        );


      const seconds =
        totalSeconds % 60;



      return (

        String(hours)
          .padStart(
            2,
            "0"
          )

        +

        ":"

        +

        String(minutes)
          .padStart(
            2,
            "0"
          )

        +

        ":"

        +

        String(seconds)
          .padStart(
            2,
            "0"
          )

      );

    }



    /* =========================================================
       UPDATE HOLD TIMER
    ========================================================= */

    function updateHoldingTimer() {


      const now =
        new Date();


      const holdingElement =
        document.getElementById(
          "holdingTime"
        );


      const remainingElement =
        document.getElementById(
          "remainingTime"
        );


      const panel =
        document.getElementById(
          "holdPanel"
        );


      const statusTitle =
        document.getElementById(
          "holdStatusTitle"
        );



      /* =======================================================
         BEFORE START
      ======================================================= */

      if (
        now.getTime()
        <
        HOLD_START.getTime()
      ) {


        holdingElement.textContent =
          "00:00:00";


        remainingElement.textContent =
          "24:00:00";


        statusTitle.textContent =
          "Hydrotest Holding Period";


        panel.classList.remove(
          "completed"
        );


        return;

      }



      /* =======================================================
         AFTER COMPLETION
      ======================================================= */

      if (
        now.getTime()
        >=
        HOLD_END.getTime()
      ) {


        holdingElement.textContent =

          formatDuration(
            TOTAL_HOLD_MS
          );


        remainingElement.textContent =
          "00:00:00";


        statusTitle.textContent =
          "Hydrotest Hold Completed";


        panel.classList.add(
          "completed"
        );


        return;

      }



      /* =======================================================
         ACTIVE HOLDING PERIOD
      ======================================================= */

      const elapsed =

        now.getTime()

        -

        HOLD_START.getTime();


      const remaining =

        HOLD_END.getTime()

        -

        now.getTime();



      holdingElement.textContent =

        formatDuration(
          elapsed
        );


      remainingElement.textContent =

        formatDuration(
          remaining
        );


      statusTitle.textContent =
        "Hydrotest Holding Period";


      panel.classList.remove(
        "completed"
      );


    }



    /* =========================================================
       INITIAL TIMER
    ========================================================= */

    updateHoldingTimer();



    /* =========================================================
       UPDATE TIMER EVERY 1 SECOND
    ========================================================= */

    setInterval(
      updateHoldingTimer,
      1000
    );



    /* =========================================================
       GOOGLE SHEET REFRESH
    ========================================================= */

    const REFRESH_TIME =
      60000;



    /* =========================================================
       GPS CONFIGURATION
    ========================================================= */

    const GPS = {


      spreadsheetId:

        "1OucgLhFiTqkeWiXJ0aI7j_tMsu9lVnqTxSK8y2AMCn4",


      gid:

        "1148130591",


      range:

        "A:Z",


      container:

        "gpsContainer",


      callback:

        "gpsResponse",


      /*
         Remove GPS INPUT column
      */

      hiddenColumns: [

        "INPUT"

      ]


    };



    /* =========================================================
       GPP4 CONFIGURATION
    ========================================================= */

    const GPP4 = {


      spreadsheetId:

        "1MKLNtFUQT8GiiVmyoXSkQjw7oPF2z44MO8gdCIUo5t0",


      /*
         Change GID here if the actual
         GPP4 response tab uses another GID.
      */

      gid:

        "0",


      range:

        "A:Z",


      container:

        "gpp4Container",


      callback:

        "gpp4Response",


      hiddenColumns: []


    };



    /* =========================================================
       LOAD GOOGLE SHEET
    ========================================================= */

    function loadSheet(config) {


      /*
         Only rows with Column A populated.
         Therefore empty rows are ignored.
      */

      const query =

        "select * where A is not null";


      const tqx =

        `out:json;responseHandler:${config.callback}`;



      const url =

        "https://docs.google.com/spreadsheets/d/"

        +

        config.spreadsheetId

        +

        "/gviz/tq"

        +

        "?gid="

        +

        config.gid

        +

        "&range="

        +

        encodeURIComponent(
          config.range
        )

        +

        "&headers=1"

        +

        "&tqx="

        +

        encodeURIComponent(
          tqx
        )

        +

        "&tq="

        +

        encodeURIComponent(
          query
        )

        +

        "&_="

        +

        Date.now();



      const script =

        document.createElement(
          "script"
        );


      script.src =
        url;


      script.async =
        true;



      /* =======================================================
         LOAD ERROR
      ======================================================= */

      script.onerror =
        function () {


          const container =

            document.getElementById(
              config.container
            );


          container.innerHTML =

            '<div class="message">'

            +

            'Unable to load Google Sheet data'

            +

            '</div>';


        };



      /* =======================================================
         CLEAN OLD JSONP SCRIPT
      ======================================================= */

      script.onload =
        function () {


          setTimeout(

            function () {


              if (
                script.parentNode
              ) {

                script.remove();

              }


            },

            1000

          );


        };


      document.head.appendChild(
        script
      );


    }



    /* =========================================================
       CHECK CELL VALUE
    ========================================================= */

    function cellHasValue(cell) {


      if (!cell) {

        return false;

      }


      return !(

        cell.v === null

        ||

        cell.v === undefined

        ||

        cell.v === ""

      );


    }



    /* =========================================================
       GET DISPLAY VALUE
    ========================================================= */

    function getCellDisplayValue(cell) {


      if (!cell) {

        return "";

      }



      /*
         Use formatted Google Sheet value first.
      */

      if (

        cell.f !== undefined

        &&

        cell.f !== null

      ) {


        return cell.f;


      }



      if (

        cell.v !== undefined

        &&

        cell.v !== null

      ) {


        return cell.v;


      }



      return "";


    }



    /* =========================================================
       AUTO SCROLL TABLE TO BOTTOM

       SHOW LATEST READING IMMEDIATELY
    ========================================================= */

    function scrollTableToBottom(
      container
    ) {


      requestAnimationFrame(

        function () {


          requestAnimationFrame(

            function () {


              container.scrollTop =

                container.scrollHeight

                -

                container.clientHeight;


            }

          );


        }

      );


    }



    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderTable(
      response,
      config
    ) {


      const container =

        document.getElementById(
          config.container
        );



      if (

        !response

        ||

        !response.table

      ) {


        container.innerHTML =

          '<div class="message">'

          +

          'No data available'

          +

          '</div>';


        return;

      }



      const columns =

        response.table.cols || [];


      const rows =

        response.table.rows || [];



      /* =======================================================
         HIDDEN COLUMNS
      ======================================================= */

      const hiddenColumns =

        (
          config.hiddenColumns || []
        )

        .map(

          function (name) {


            return String(name)

              .trim()

              .toUpperCase();


          }

        );



      /* =======================================================
         FIND VISIBLE COLUMNS
      ======================================================= */

      const visibleColumns =
        [];


      columns.forEach(

        function (
          column,
          index
        ) {


          const columnName =

            String(
              column.label || ""
            )

            .trim()

            .toUpperCase();



          /* ---------------------------------------------------
             HIDE CONFIGURED COLUMN
          --------------------------------------------------- */

          if (

            hiddenColumns.includes(
              columnName
            )

          ) {


            return;


          }



          /* ---------------------------------------------------
             CHECK COLUMN DATA
          --------------------------------------------------- */

          const hasData =

            rows.some(

              function (row) {


                if (!row.c) {

                  return false;

                }


                return cellHasValue(
                  row.c[index]
                );


              }

            );



          /* ---------------------------------------------------
             REMOVE COMPLETELY EMPTY COLUMNS
          --------------------------------------------------- */

          if (

            columnName !== ""

            ||

            hasData

          ) {


            visibleColumns.push({


              column:
                column,


              index:
                index


            });


          }


        }

      );



      /* =======================================================
         NO COLUMNS
      ======================================================= */

      if (
        visibleColumns.length === 0
      ) {


        container.innerHTML =

          '<div class="message">'

          +

          'No data available'

          +

          '</div>';


        return;

      }



      /* =======================================================
         CREATE TABLE
      ======================================================= */

      const table =

        document.createElement(
          "table"
        );



      /* =======================================================
         TABLE HEADER
      ======================================================= */

      const thead =

        document.createElement(
          "thead"
        );


      const headerRow =

        document.createElement(
          "tr"
        );


      visibleColumns.forEach(

        function (item) {


          const th =

            document.createElement(
              "th"
            );


          th.textContent =

            item.column.label || "";


          headerRow.appendChild(
            th
          );


        }

      );


      thead.appendChild(
        headerRow
      );


      table.appendChild(
        thead
      );



      /* =======================================================
         TABLE BODY
      ======================================================= */

      const tbody =

        document.createElement(
          "tbody"
        );


      let rowCount =
        0;


      let lastRowElement =
        null;



      rows.forEach(

        function (row) {



          /* ---------------------------------------------------
             IGNORE EMPTY ROW
          --------------------------------------------------- */

          const hasData =

            visibleColumns.some(

              function (item) {


                if (!row.c) {

                  return false;

                }


                return cellHasValue(
                  row.c[item.index]
                );


              }

            );


          if (!hasData) {

            return;

          }



          rowCount++;



          /* ---------------------------------------------------
             CREATE ROW
          --------------------------------------------------- */

          const tr =

            document.createElement(
              "tr"
            );



          /* ---------------------------------------------------
             CREATE CELLS
          --------------------------------------------------- */

          visibleColumns.forEach(

            function (item) {


              const td =

                document.createElement(
                  "td"
                );


              const cell =

                row.c

                ? row.c[
                    item.index
                  ]

                : null;



              td.textContent =

                getCellDisplayValue(
                  cell
                );


              tr.appendChild(
                td
              );


            }

          );


          tbody.appendChild(
            tr
          );


          /*
             Save latest row.
          */

          lastRowElement =
            tr;


        }

      );



      /* =======================================================
         NO DATA
      ======================================================= */

      if (
        rowCount === 0
      ) {


        container.innerHTML =

          '<div class="message">'

          +

          'No readings available yet'

          +

          '</div>';


        return;

      }



      /* =======================================================
         HIGHLIGHT LATEST ROW
      ======================================================= */

      if (
        lastRowElement
      ) {


        lastRowElement.classList.add(
          "latest-row"
        );


      }



      /* =======================================================
         ADD TABLE BODY
      ======================================================= */

      table.appendChild(
        tbody
      );



      /* =======================================================
         DISPLAY TABLE
      ======================================================= */

      container.innerHTML =
        "";


      container.appendChild(
        table
      );



      /* =======================================================
         AUTOMATICALLY SHOW LATEST READING
      ======================================================= */

      scrollTableToBottom(
        container
      );


    }



    /* =========================================================
       GPS CALLBACK
    ========================================================= */

    window.gpsResponse =

      function (response) {


        renderTable(
          response,
          GPS
        );


      };



    /* =========================================================
       GPP4 CALLBACK
    ========================================================= */

    window.gpp4Response =

      function (response) {


        renderTable(
          response,
          GPP4
        );


      };



    /* =========================================================
       REFRESH BOTH SHEETS
    ========================================================= */

    function refreshAll() {


      loadSheet(
        GPS
      );


      loadSheet(
        GPP4
      );


    }



    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    refreshAll();



    /* =========================================================
       AUTO REFRESH EVERY 60 SECONDS
    ========================================================= */

    setInterval(

      refreshAll,

      REFRESH_TIME

    );


  </script>


</body>

</html>
