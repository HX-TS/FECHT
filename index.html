<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>FEC Hydrotest Instrument Update</title>

  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    :root {
      --black: #050505;
      --cream: #f2efe9;
      --cream-2: #ebe8e2;
      --line: #cbc7bf;

      --datetime-width: 150px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: var(--black);

      color: var(--black);

      overflow: hidden;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      background: var(--black);

      padding: 7px;

      gap: 7px;
    }


    /* =========================================================
       HERO / MAIN TITLE
       SAME STYLE AS KREJUV FEC BOOKMARK
    ========================================================= */

    .hero {
      flex-shrink: 0;

      height: clamp(125px, 22vh, 245px);

      background: var(--cream);

      border: 1px solid var(--black);

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      overflow: hidden;

      padding: 10px 20px;
    }

    .hero-title {
      font-size: clamp(36px, 6vw, 98px);

      font-weight: 900;

      line-height: 0.82;

      letter-spacing: -0.05em;

      text-transform: uppercase;

      color: var(--black);
    }

    .hero-title span {
      display: block;
    }

    .hero-subtitle {
      margin-top: clamp(10px, 2vh, 22px);

      font-size: clamp(9px, 1vw, 15px);

      font-weight: 700;

      letter-spacing: 0.32em;
    }


    /* =========================================================
       DASHBOARD
    ========================================================= */

    .dashboard {
      flex: 1;
      min-height: 0;

      display: grid;

      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 7px;
    }


    /* =========================================================
       READING PANEL
    ========================================================= */

    .reading-panel {
      min-height: 0;

      display: flex;
      flex-direction: column;

      background: var(--cream);

      border: 1px solid var(--black);

      overflow: hidden;
    }


    /* =========================================================
       PANEL TITLE
    ========================================================= */

    .panel-title {
      flex-shrink: 0;

      min-height: 43px;

      display: flex;

      align-items: center;
      justify-content: flex-start;

      padding: 0 16px;

      border-bottom: 1px solid var(--line);

      background: var(--cream);

      color: var(--black);

      font-size: 13px;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 0.03em;
    }


    /* =========================================================
       TABLE WRAPPER
    ========================================================= */

    .table-wrapper {
      flex: 1;
      min-height: 0;

      overflow: auto;

      background: var(--cream);

      scrollbar-width: thin;
      scrollbar-color: #888 var(--cream-2);
    }

    .table-wrapper::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .table-wrapper::-webkit-scrollbar-track {
      background: var(--cream-2);
    }

    .table-wrapper::-webkit-scrollbar-thumb {
      background: #888;
    }


    /* =========================================================
       TABLE
    ========================================================= */

    table {
      width: 100%;

      border-collapse: collapse;

      table-layout: auto;

      background: var(--cream);

      color: var(--black);

      font-size: 13px;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    thead {
      position: sticky;

      top: 0;

      z-index: 10;
    }

    th {
      min-width: 125px;

      height: 52px;

      padding: 8px 12px;

      background: var(--cream);

      color: var(--black);

      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--black);

      text-align: left;

      vertical-align: middle;

      font-size: 11px;

      font-weight: 900;

      text-transform: uppercase;

      line-height: 1.2;
    }

    th:last-child {
      border-right: none;
    }


    /* =========================================================
       DATA CELLS
    ========================================================= */

    td {
      min-width: 125px;

      height: 39px;

      padding: 7px 12px;

      background: var(--cream);

      color: var(--black);

      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      text-align: left;

      vertical-align: middle;

      white-space: nowrap;

      font-size: 12px;

      font-weight: 600;
    }

    td:last-child {
      border-right: none;
    }

    tbody tr:hover td {
      background: #e9e5de;
    }


    /* =========================================================
       TIMESTAMP / DATE / TIME

       SAME SIZE FOR GPS & GPP4
    ========================================================= */

    th:nth-child(1),
    td:nth-child(1),

    th:nth-child(2),
    td:nth-child(2),

    th:nth-child(3),
    td:nth-child(3) {

      width: var(--datetime-width);

      min-width: var(--datetime-width);

      max-width: var(--datetime-width);
    }


    /* =========================================================
       LOADING / ERROR
    ========================================================= */

    .message {
      width: 100%;
      height: 100%;

      min-height: 80px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: var(--cream);

      color: var(--black);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.03em;

      text-transform: uppercase;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      flex-shrink: 0;

      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: var(--cream);

      border: 1px solid var(--black);

      color: var(--black);

      font-size: 10px;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 0.08em;
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 900px) {

      :root {
        --datetime-width: 135px;
      }

      .page {
        padding: 5px;
        gap: 5px;
      }

      .dashboard {
        gap: 5px;
      }

      .hero {
        height: clamp(115px, 19vh, 190px);
      }

      .hero-title {
        font-size: clamp(32px, 7vw, 68px);
      }

      .panel-title {
        min-height: 36px;

        padding: 0 12px;

        font-size: 11px;
      }

      th {
        min-width: 115px;

        height: 45px;

        padding: 7px 9px;

        font-size: 10px;
      }

      td {
        min-width: 115px;

        height: 34px;

        padding: 6px 9px;

        font-size: 11px;
      }

    }


    /* =========================================================
       PHONE
    ========================================================= */

    @media (max-width: 600px) {

      :root {
        --datetime-width: 115px;
      }

      .page {
        padding:
          max(3px, env(safe-area-inset-top))
          3px
          max(3px, env(safe-area-inset-bottom));

        gap: 3px;
      }

      .hero {
        height: 105px;

        padding: 8px 10px;
      }

      .hero-title {
        font-size: clamp(27px, 9vw, 43px);

        line-height: 0.88;
      }

      .hero-subtitle {
        margin-top: 8px;

        font-size: 8px;

        letter-spacing: 0.28em;
      }

      .dashboard {
        gap: 3px;
      }

      .panel-title {
        min-height: 31px;

        padding: 0 9px;

        font-size: 10px;
      }

      th {
        min-width: 100px;

        height: 41px;

        padding: 6px 7px;

        font-size: 9px;
      }

      td {
        min-width: 100px;

        height: 31px;

        padding: 5px 7px;

        font-size: 10px;
      }

      .footer {
        height: 28px;

        font-size: 8px;
      }

    }


    /* =========================================================
       PHONE LANDSCAPE
    ========================================================= */

    @media (max-height: 600px) {

      .hero {
        height: 78px;
      }

      .hero-title {
        font-size: clamp(24px, 5vw, 43px);
      }

      .hero-title span {
        display: inline;
      }

      .hero-title span + span::before {
        content: " ";
      }

      .hero-subtitle {
        margin-top: 5px;
      }

      .panel-title {
        min-height: 25px;

        font-size: 9px;
      }

      th {
        height: 32px;

        padding: 4px 7px;
      }

      td {
        height: 26px;

        padding: 3px 7px;
      }

      .footer {
        height: 22px;
      }

    }

  </style>
</head>


<body>

  <div class="page">


    <!-- =====================================================
         HERO
    ====================================================== -->

    <header class="hero">

      <div class="hero-title">

        <span>FEC HYDROTEST</span>

        <span>INSTRUMENT UPDATE</span>

      </div>

      <div class="hero-subtitle">
        TechSmith
      </div>

    </header>



    <!-- =====================================================
         DASHBOARD
    ====================================================== -->

    <main class="dashboard">


      <!-- ===================================================
           GPS
      ==================================================== -->

      <section class="reading-panel">

        <div class="panel-title">
          GPS READING
        </div>


        <div
          class="table-wrapper"
          id="gpsContainer"
        >

          <div class="message">
            Loading GPS data...
          </div>

        </div>

      </section>



      <!-- ===================================================
           GPP4
      ==================================================== -->

      <section class="reading-panel">

        <div class="panel-title">
          GPP4 READING
        </div>


        <div
          class="table-wrapper"
          id="gpp4Container"
        >

          <div class="message">
            Loading GPP4 data...
          </div>

        </div>

      </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">
      Fly TechSmith
    </footer>


  </div>



  <script>

    /* =========================================================
       AUTO REFRESH
    ========================================================= */

    const REFRESH_TIME = 60000;



    /* =========================================================
       GPS
    ========================================================= */

    const GPS = {

      spreadsheetId:
        "1OucgLhFiTqkeWiXJ0aI7j_tMsu9lVnqTxSK8y2AMCn4",

      gid:
        "1148130591",

      range:
        "A:Z",

      container:
        "gpsContainer",

      callback:
        "gpsResponse",

      /*
         Do not show INPUT column on GPS dashboard
      */

      hiddenColumns: [
        "INPUT"
      ]

    };



    /* =========================================================
       GPP4
    ========================================================= */

    const GPP4 = {

      spreadsheetId:
        "1MKLNtFUQT8GiiVmyoXSkQjw7oPF2z44MO8gdCIUo5t0",

      /*
         Change this if the GPP4 response tab
         has a different GID.
      */

      gid:
        "0",

      range:
        "A:Z",

      container:
        "gpp4Container",

      callback:
        "gpp4Response",

      hiddenColumns: []

    };



    /* =========================================================
       LOAD GOOGLE SHEET
    ========================================================= */

    function loadSheet(config) {

      /*
         Only rows with Timestamp / Column A populated.
         Blank rows will not be returned.
      */

      const query =
        "select * where A is not null";


      const tqx =
        `out:json;responseHandler:${config.callback}`;


      const url =
        "https://docs.google.com/spreadsheets/d/" +
        config.spreadsheetId +
        "/gviz/tq" +

        "?gid=" +
        config.gid +

        "&range=" +
        encodeURIComponent(config.range) +

        "&headers=1" +

        "&tqx=" +
        encodeURIComponent(tqx) +

        "&tq=" +
        encodeURIComponent(query) +

        "&_=" +
        Date.now();


      const script =
        document.createElement("script");


      script.src = url;

      script.async = true;


      script.onerror = function () {

        document.getElementById(
          config.container
        ).innerHTML =

          '<div class="message">' +
          'Unable to load Google Sheet data' +
          '</div>';

      };


      script.onload = function () {

        setTimeout(function () {

          if (script.parentNode) {
            script.remove();
          }

        }, 1000);

      };


      document.head.appendChild(script);

    }



    /* =========================================================
       CHECK CELL
    ========================================================= */

    function cellHasValue(cell) {

      if (!cell) {
        return false;
      }

      return !(
        cell.v === null ||
        cell.v === undefined ||
        cell.v === ""
      );

    }



    /* =========================================================
       FORMAT CELL
    ========================================================= */

    function getCellDisplayValue(cell) {

      if (!cell) {
        return "";
      }


      /*
         Use formatted Google Sheets value first.
      */

      if (
        cell.f !== undefined &&
        cell.f !== null
      ) {

        return cell.f;

      }


      if (
        cell.v !== undefined &&
        cell.v !== null
      ) {

        return cell.v;

      }


      return "";

    }



    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderTable(response, config) {

      const container =
        document.getElementById(
          config.container
        );


      if (
        !response ||
        !response.table
      ) {

        container.innerHTML =
          '<div class="message">' +
          'No data available' +
          '</div>';

        return;

      }


      const columns =
        response.table.cols || [];


      const rows =
        response.table.rows || [];



      /* =======================================================
         HIDDEN COLUMNS
      ======================================================= */

      const hiddenColumns =
        (config.hiddenColumns || [])
          .map(function (name) {

            return String(name)
              .trim()
              .toUpperCase();

          });



      /* =======================================================
         DETERMINE VISIBLE COLUMNS
      ======================================================= */

      const visibleColumns = [];


      columns.forEach(
        function (column, index) {

          const columnName =
            String(column.label || "")
              .trim()
              .toUpperCase();


          /*
             Hide GPS INPUT
          */

          if (
            hiddenColumns.includes(
              columnName
            )
          ) {

            return;

          }


          /*
             Check whether column contains any data.
          */

          const hasData =
            rows.some(
              function (row) {

                if (!row.c) {
                  return false;
                }


                return cellHasValue(
                  row.c[index]
                );

              }
            );


          /*
             Ignore completely empty columns.
          */

          if (
            columnName !== "" ||
            hasData
          ) {

            visibleColumns.push({

              column: column,

              index: index

            });

          }

        }
      );



      /* =======================================================
         NOTHING TO SHOW
      ======================================================= */

      if (
        visibleColumns.length === 0
      ) {

        container.innerHTML =
          '<div class="message">' +
          'No data available' +
          '</div>';

        return;

      }



      /* =======================================================
         TABLE
      ======================================================= */

      const table =
        document.createElement("table");



      /* =======================================================
         HEADER
      ======================================================= */

      const thead =
        document.createElement("thead");


      const headerRow =
        document.createElement("tr");


      visibleColumns.forEach(
        function (item) {

          const th =
            document.createElement("th");


          th.textContent =
            item.column.label || "";


          headerRow.appendChild(th);

        }
      );


      thead.appendChild(
        headerRow
      );


      table.appendChild(
        thead
      );



      /* =======================================================
         BODY
      ======================================================= */

      const tbody =
        document.createElement("tbody");


      let rowCount = 0;


      rows.forEach(
        function (row) {

          /*
             Ignore completely blank rows.
          */

          const hasData =
            visibleColumns.some(
              function (item) {

                if (!row.c) {
                  return false;
                }


                return cellHasValue(
                  row.c[item.index]
                );

              }
            );


          if (!hasData) {
            return;
          }


          rowCount++;


          const tr =
            document.createElement("tr");


          visibleColumns.forEach(
            function (item) {

              const td =
                document.createElement("td");


              const cell =
                row.c
                  ? row.c[item.index]
                  : null;


              td.textContent =
                getCellDisplayValue(
                  cell
                );


              tr.appendChild(td);

            }
          );


          tbody.appendChild(tr);

        }
      );



      /* =======================================================
         NO READINGS YET
      ======================================================= */

      if (rowCount === 0) {

        container.innerHTML =
          '<div class="message">' +
          'No readings available yet' +
          '</div>';

        return;

      }


      table.appendChild(
        tbody
      );


      container.innerHTML = "";


      container.appendChild(
        table
      );

    }



    /* =========================================================
       GPS CALLBACK
    ========================================================= */

    window.gpsResponse =
      function (response) {

        renderTable(
          response,
          GPS
        );

      };



    /* =========================================================
       GPP4 CALLBACK
    ========================================================= */

    window.gpp4Response =
      function (response) {

        renderTable(
          response,
          GPP4
        );

      };



    /* =========================================================
       REFRESH
    ========================================================= */

    function refreshAll() {

      loadSheet(GPS);

      loadSheet(GPP4);

    }


    refreshAll();


    setInterval(
      refreshAll,
      REFRESH_TIME
    );

  </script>

</body>

</html>
