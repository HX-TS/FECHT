<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>FEC Hydrotest Live Dashboard</title>


  <!-- =========================================================
       FAVICON
  ========================================================= -->

  <link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/gbgLwSqg/Chat-GPT-Image-Jul-26-2026-04-53-23-AM-2.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="https://i.ibb.co/gbgLwSqg/Chat-GPT-Image-Jul-26-2026-04-53-23-AM-2.png"
  >

  <link
    rel="apple-touch-icon"
    href="https://i.ibb.co/gbgLwSqg/Chat-GPT-Image-Jul-26-2026-04-53-23-AM-2.png"
  >


  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    :root {

      --black: #050505;

      --cream: #f2efe9;

      --cream-2: #ebe8e2;

      --line: #cbc7bf;

      --red: #e01b24;

      --orange: #ff8500;

      --green: #16853e;

      --datetime-width: 150px;

    }


    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    html,
    body {

      width: 100%;

      height: 100%;

    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: var(--black);

      color: var(--black);

      overflow: hidden;

    }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {

      width: 100%;

      height: 100dvh;

      display: flex;

      flex-direction: column;

      background: var(--black);

      padding: 7px;

      gap: 7px;

    }


    /* =========================================================
       HEADER
    ========================================================= */

    .hero {

      flex-shrink: 0;

      min-height: 160px;

      height: clamp(
        160px,
        21vh,
        220px
      );

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(330px, 390px)
        minmax(210px, 260px);

      background: var(--cream);

      border:
        1px solid
        var(--black);

      overflow: hidden;

    }


    /* =========================================================
       HEADER LEFT
    ========================================================= */

    .hero-left {

      min-width: 0;

      display: flex;

      flex-direction: column;

      align-items: flex-start;

      justify-content: center;

      padding:
        20px
        30px;

    }


    .hero-title {

      font-size: clamp(
        36px,
        4.5vw,
        76px
      );

      font-weight: 900;

      line-height: 0.87;

      letter-spacing: -0.05em;

      text-transform: uppercase;

      text-align: left;

      color: var(--black);

    }


    .hero-title span {

      display: block;

    }


    .hero-subtitle {

      margin-top: 14px;

      font-size: clamp(
        9px,
        0.8vw,
        13px
      );

      font-weight: 700;

      letter-spacing: 0.30em;

    }


    /* =========================================================
       HOLDING PERIOD PANEL
    ========================================================= */

    .hold-panel {

      min-width: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding:
        17px
        22px;

      border-left:
        1px solid
        var(--black);

      background: var(--cream);

    }


    /* =========================================================
       LIVE TITLE
    ========================================================= */

    .hold-title-row {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 14px;

    }


    .live-dot {

      width: 10px;

      height: 10px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--red);

      box-shadow:
        0 0 0 0
        rgba(224, 27, 36, 0.75);

      animation:
        livePulse
        1.15s
        infinite;

    }


    @keyframes livePulse {

      0% {

        background:
          var(--red);

        box-shadow:
          0 0 0 0
          rgba(224, 27, 36, 0.8);

      }


      50% {

        background:
          var(--orange);

        box-shadow:
          0 0 0 8px
          rgba(224, 27, 36, 0);

      }


      100% {

        background:
          var(--red);

        box-shadow:
          0 0 0 0
          rgba(224, 27, 36, 0);

      }

    }


    .hold-panel-title {

      font-size: 14px;

      line-height: 1.15;

      font-weight: 900;

      letter-spacing: 0.045em;

      text-transform: uppercase;

    }


    /* =========================================================
       TIMER GRID
    ========================================================= */

    .timer-grid {

      display: grid;

      grid-template-columns:
        1fr
        auto;

      column-gap: 18px;

      row-gap: 9px;

      align-items: center;

    }


    .timer-label {

      font-size: 11px;

      font-weight: 800;

      line-height: 1.2;

      letter-spacing: 0.04em;

      text-transform: uppercase;

      color: #4e4b45;

    }


    .timer-value {

      min-width: 112px;

      text-align: right;

      font-size: 19px;

      line-height: 1;

      font-weight: 900;

      font-variant-numeric:
        tabular-nums;

      letter-spacing: 0.04em;

      color: var(--black);

    }


    /* =========================================================
       BLINKING HOLDING TIME
    ========================================================= */

    .timer-value.live {

      animation:
        timerBlink
        1.25s
        ease-in-out
        infinite;

    }


    @keyframes timerBlink {

      0% {

        color:
          var(--black);

      }


      50% {

        color:
          var(--red);

      }


      100% {

        color:
          var(--black);

      }

    }


    .timer-divider {

      grid-column:
        1 / -1;

      height: 1px;

      margin:
        2px
        0;

      background:
        var(--line);

    }


    /* =========================================================
       START / COMPLETION
    ========================================================= */

    .timer-note {

      margin-top: 14px;

      padding-top: 9px;

      border-top:
        1px solid
        var(--line);

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 10px;

    }


    .timer-note-item {

      font-size: 9px;

      line-height: 1.3;

      font-weight: 700;

      color: #5b5751;

      text-transform: uppercase;

    }


    .timer-note-item strong {

      display: block;

      margin-top: 3px;

      font-size: 10px;

      line-height: 1.3;

      color: var(--black);

    }


    .timer-note-item:last-child {

      text-align: right;

    }


    /* =========================================================
       COMPLETED STATUS
    ========================================================= */

    .hold-panel.completed
    .live-dot {

      background:
        var(--green);

      animation: none;

      box-shadow: none;

    }


    .hold-panel.completed
    .timer-value.live {

      color:
        var(--green);

      animation: none;

    }


    /* =========================================================
       PRESSURE TRENDING BOX
    ========================================================= */

    .trend-link {

      min-width: 0;

      display: flex;

      text-decoration: none;

      color: inherit;

      border-left:
        1px solid
        var(--black);

      background:
        var(--cream);

    }


    .trend-panel {

      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        18px
        16px;

      text-align: center;

      cursor: pointer;

      transition:
        background
        0.15s ease;

    }


    .trend-panel:hover {

      background:
        #e5e1da;

    }


    .trend-status {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      margin-bottom: 11px;

    }


    .trend-dot {

      width: 10px;

      height: 10px;

      flex-shrink: 0;

      border-radius: 50%;

      background:
        var(--red);

      animation:
        trendDotPulse
        1s
        infinite;

    }


    @keyframes trendDotPulse {

      0% {

        background:
          var(--red);

        box-shadow:
          0 0 0 0
          rgba(224, 27, 36, 0.8);

      }


      50% {

        background:
          var(--orange);

        box-shadow:
          0 0 0 8px
          rgba(224, 27, 36, 0);

      }


      100% {

        background:
          var(--red);

        box-shadow:
          0 0 0 0
          rgba(224, 27, 36, 0);

      }

    }


    .trend-live {

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 0.10em;

      text-transform: uppercase;

    }


    .trend-title {

      font-size: clamp(
        18px,
        1.5vw,
        24px
      );

      line-height: 1;

      font-weight: 900;

      letter-spacing: -0.02em;

      text-transform: uppercase;

      animation:
        trendTextBlink
        1.15s
        ease-in-out
        infinite;

    }


    @keyframes trendTextBlink {

      0% {

        color:
          var(--black);

      }


      50% {

        color:
          var(--red);

      }


      100% {

        color:
          var(--black);

      }

    }


    .trend-subtitle {

      margin-top: 11px;

      font-size: 8px;

      font-weight: 700;

      line-height: 1.4;

      letter-spacing: 0.08em;

      color: #625e57;

      text-transform: uppercase;

    }


    .trend-arrow {

      margin-top: 12px;

      font-size: 20px;

      font-weight: 900;

      line-height: 1;

    }


    /* =========================================================
       DASHBOARD
    ========================================================= */

    .dashboard {

      flex: 1;

      min-height: 0;

      display: grid;

      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 7px;

    }


    /* =========================================================
       READING PANEL
    ========================================================= */

    .reading-panel {

      min-height: 0;

      display: flex;

      flex-direction: column;

      background:
        var(--cream);

      border:
        1px solid
        var(--black);

      overflow: hidden;

    }


    /* =========================================================
       READING PANEL TITLE
    ========================================================= */

    .panel-title {

      flex-shrink: 0;

      min-height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        0
        16px;

      background:
        var(--cream);

      border-bottom:
        1px solid
        var(--line);

      text-align: center;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 0.03em;

      text-transform: uppercase;

    }


    /* =========================================================
       TABLE WRAPPER
    ========================================================= */

    .table-wrapper {

      flex: 1;

      min-height: 0;

      overflow-x: auto;

      overflow-y: auto;

      background:
        var(--cream);

      scrollbar-width: thin;

      scrollbar-color:
        #888
        var(--cream-2);

      scroll-behavior: auto;

    }


    .table-wrapper::-webkit-scrollbar {

      width: 8px;

      height: 8px;

    }


    .table-wrapper::-webkit-scrollbar-track {

      background:
        var(--cream-2);

    }


    .table-wrapper::-webkit-scrollbar-thumb {

      background:
        #888;

    }


    /* =========================================================
       TABLE
    ========================================================= */

    table {

      width: 100%;

      border-collapse: collapse;

      table-layout: auto;

      background:
        var(--cream);

      color:
        var(--black);

      font-size: 13px;

    }


    /* =========================================================
       TABLE HEADER
    ========================================================= */

    thead {

      position: sticky;

      top: 0;

      z-index: 10;

    }


    th {

      min-width: 125px;

      height: 50px;

      padding:
        8px
        12px;

      background:
        var(--cream);

      color:
        var(--black);

      border-right:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--black);

      text-align: center;

      vertical-align: middle;

      font-size: 11px;

      font-weight: 900;

      line-height: 1.2;

      text-transform: uppercase;

    }


    th:last-child {

      border-right: none;

    }


    /* =========================================================
       TABLE DATA
    ========================================================= */

    td {

      min-width: 125px;

      height: 38px;

      padding:
        7px
        12px;

      background:
        var(--cream);

      color:
        var(--black);

      border-right:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--line);

      text-align: center;

      vertical-align: middle;

      white-space: nowrap;

      font-size: 12px;

      font-weight: 600;

    }


    td:last-child {

      border-right: none;

    }


    tbody tr:hover td {

      background:
        #e9e5de;

    }


    /* =========================================================
       LATEST READING
    ========================================================= */

    tbody tr.latest-row td {

      font-weight: 900;

      border-top:
        2px solid
        var(--black);

      background:
        #e7e3dc;

    }


    /* =========================================================
       DATETIME WIDTHS
    ========================================================= */

    th:nth-child(1),
    td:nth-child(1),

    th:nth-child(2),
    td:nth-child(2),

    th:nth-child(3),
    td:nth-child(3) {

      width:
        var(--datetime-width);

      min-width:
        var(--datetime-width);

      max-width:
        var(--datetime-width);

    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    .message {

      width: 100%;

      height: 100%;

      min-height: 80px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        var(--cream);

      text-align: center;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.03em;

      text-transform: uppercase;

    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {

      flex-shrink: 0;

      min-height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        7px
        10px
        max(
          7px,
          env(safe-area-inset-bottom)
        );

      background:
        var(--cream);

      border:
        1px solid
        var(--black);

      text-align: center;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 0.08em;

      text-transform: uppercase;

    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 1100px) {

      :root {

        --datetime-width: 135px;

      }


      .hero {

        grid-template-columns:
          minmax(0, 1fr)
          315px
          190px;

      }


      .hero-left {

        padding:
          15px
          18px;

      }


      .hero-title {

        font-size:
          clamp(
            29px,
            4.8vw,
            55px
          );

      }


      .hold-panel {

        padding:
          14px
          15px;

      }


      .hold-panel-title {

        font-size: 12px;

      }


      .timer-label {

        font-size: 10px;

      }


      .timer-value {

        font-size: 17px;

      }


      .trend-title {

        font-size: 17px;

      }


      .trend-panel {

        padding:
          15px
          10px;

      }

    }


    /* =========================================================
       PHONE
    ========================================================= */

    @media (max-width: 700px) {

      :root {

        --datetime-width: 115px;

      }


      body {

        overflow: hidden;

      }


      .page {

        padding:
          max(
            3px,
            env(safe-area-inset-top)
          )
          3px
          max(
            3px,
            env(safe-area-inset-bottom)
          );

        gap: 3px;

      }


      /* ---------------------------------------------------------
         PHONE HEADER
         TITLE ON TOP
         TIMER + TRENDING BELOW
      --------------------------------------------------------- */

      .hero {

        height: 174px;

        min-height: 174px;

        display: grid;

        grid-template-columns:
          1fr
          1fr;

        grid-template-rows:
          68px
          106px;

      }


      .hero-left {

        grid-column:
          1 / -1;

        grid-row: 1;

        padding:
          8px
          10px;

        justify-content: center;

        border-bottom:
          1px solid
          var(--black);

      }


      .hero-title {

        font-size:
          clamp(
            23px,
            7vw,
            32px
          );

        line-height: 0.88;

      }


      .hero-title span {

        display: inline;

      }


      .hero-title
      span + span::before {

        content: " ";

      }


      .hero-subtitle {

        margin-top: 5px;

        font-size: 6px;

      }


      /* ---------------------------------------------------------
         PHONE TIMER
      --------------------------------------------------------- */

      .hold-panel {

        grid-column: 1;

        grid-row: 2;

        border-left: none;

        border-right:
          1px solid
          var(--black);

        padding:
          8px
          9px;

      }


      .hold-title-row {

        gap: 6px;

        margin-bottom: 7px;

      }


      .live-dot {

        width: 7px;

        height: 7px;

      }


      .hold-panel-title {

        font-size: 9px;

        line-height: 1.15;

        letter-spacing: 0.02em;

      }


      .timer-grid {

        column-gap: 5px;

        row-gap: 4px;

      }


      .timer-label {

        font-size: 7px;

      }


      .timer-value {

        min-width: 70px;

        font-size: 12px;

      }


      .timer-note {

        margin-top: 6px;

        padding-top: 5px;

        gap: 3px;

      }


      .timer-note-item {

        font-size: 6px;

      }


      .timer-note-item strong {

        margin-top: 1px;

        font-size: 7px;

      }


      /* ---------------------------------------------------------
         PHONE PRESSURE TREND
      --------------------------------------------------------- */

      .trend-link {

        grid-column: 2;

        grid-row: 2;

        border-left: none;

      }


      .trend-panel {

        padding:
          8px
          7px;

      }


      .trend-status {

        gap: 5px;

        margin-bottom: 6px;

      }


      .trend-dot {

        width: 7px;

        height: 7px;

      }


      .trend-live {

        font-size: 7px;

      }


      .trend-title {

        font-size: 15px;

      }


      .trend-subtitle {

        margin-top: 6px;

        font-size: 6px;

      }


      .trend-arrow {

        margin-top: 6px;

        font-size: 14px;

      }


      /* ---------------------------------------------------------
         TABLE
      --------------------------------------------------------- */

      .dashboard {

        gap: 3px;

      }


      .panel-title {

        min-height: 29px;

        font-size: 10px;

      }


      th {

        min-width: 100px;

        height: 38px;

        padding:
          6px
          7px;

        font-size: 9px;

      }


      td {

        min-width: 100px;

        height: 29px;

        padding:
          5px
          7px;

        font-size: 10px;

      }


      .footer {

        min-height: 25px;

        padding:
          4px
          8px;

        font-size: 8px;

      }

    }


    /* =========================================================
       SHORT SCREEN / LANDSCAPE PHONE
    ========================================================= */

    @media (max-height: 600px) and (min-width: 701px) {

      .hero {

        min-height: 95px;

        height: 95px;

      }


      .hero-left {

        padding:
          8px
          15px;

      }


      .hero-title {

        font-size:
          clamp(
            22px,
            3.6vw,
            42px
          );

      }


      .hero-title span {

        display: inline;

      }


      .hero-title
      span + span::before {

        content: " ";

      }


      .hero-subtitle {

        margin-top: 4px;

      }


      .hold-panel {

        padding:
          6px
          12px;

      }


      .hold-title-row {

        margin-bottom: 5px;

      }


      .hold-panel-title {

        font-size: 10px;

      }


      .timer-grid {

        row-gap: 3px;

      }


      .timer-label {

        font-size: 8px;

      }


      .timer-value {

        font-size: 14px;

      }


      .timer-note {

        margin-top: 5px;

        padding-top: 4px;

      }


      .trend-title {

        font-size: 16px;

      }


      .trend-subtitle {

        margin-top: 4px;

      }


      .panel-title {

        min-height: 24px;

        font-size: 9px;

      }


      th {

        height: 30px;

        padding:
          4px
          7px;

      }


      td {

        height: 24px;

        padding:
          3px
          7px;

      }


      .footer {

        min-height: 22px;

        padding: 3px;

        font-size: 7px;

      }

    }

  </style>

</head>



<body>


  <div class="page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="hero">


      <!-- ===================================================
           TITLE
      ==================================================== -->

      <div class="hero-left">


        <div class="hero-title">

          <span>
            FEC HYDROTEST
          </span>

          <span>
            LIVE DASHBOARD
          </span>

        </div>


        <div class="hero-subtitle">

          TechSmith

        </div>


      </div>



      <!-- ===================================================
           HYDROTEST HOLDING PERIOD
      ==================================================== -->

      <div
        class="hold-panel"
        id="holdPanel"
      >


        <div class="hold-title-row">


          <div
            class="live-dot"
          ></div>


          <div
            class="hold-panel-title"
            id="holdStatusTitle"
          >

            Hydrotest Holding Period

          </div>


        </div>



        <div class="timer-grid">


          <div class="timer-label">

            Holding Time

          </div>


          <div
            class="timer-value live"
            id="holdingTime"
          >

            00:00:00

          </div>



          <div class="timer-divider"></div>



          <div class="timer-label">

            Remaining Hrs

          </div>


          <div
            class="timer-value"
            id="remainingTime"
          >

            24:00:00

          </div>


        </div>



        <div class="timer-note">


          <div class="timer-note-item">

            Start

            <strong>
              21:30 HRS
              <br>
              21/8/2026
            </strong>

          </div>


          <div class="timer-note-item">

            Completion

            <strong>
              21:30 HRS
              <br>
              22/8/2026
            </strong>

          </div>


        </div>


      </div>



      <!-- ===================================================
           PRESSURE TRENDING
      ==================================================== -->

      <a
        class="trend-link"
        href="https://hx-ts.github.io/FECHT/GRAPH/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Pressure Trending Graph"
      >


        <div class="trend-panel">


          <div class="trend-status">

            <div class="trend-dot"></div>

            <div class="trend-live">
              Live
            </div>

          </div>


          <div class="trend-title">

            Pressure
            <br>
            Trending

          </div>


          <div class="trend-subtitle">

            Open Live
            <br>
            Hydrotest Graph

          </div>


          <div class="trend-arrow">

            ↗

          </div>


        </div>


      </a>


    </header>



    <!-- =====================================================
         DASHBOARD
    ====================================================== -->

    <main class="dashboard">


      <!-- ===================================================
           GPS READING
      ==================================================== -->

      <section class="reading-panel">


        <div class="panel-title">

          GPS READING

        </div>


        <div
          class="table-wrapper"
          id="gpsContainer"
        >


          <div class="message">

            Loading GPS Data...

          </div>


        </div>


      </section>



      <!-- ===================================================
           GPP4 READING
      ==================================================== -->

      <section class="reading-panel">


        <div class="panel-title">

          GPP4 READING

        </div>


        <div
          class="table-wrapper"
          id="gpp4Container"
        >


          <div class="message">

            Loading GPP4 Data...

          </div>


        </div>


      </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

      Fly TechSmith

    </footer>


  </div>



  <script>


    /* =========================================================
       HYDROTEST HOLDING PERIOD
       MALAYSIA TIME UTC +08:00

       START:
       21/8/2026 21:30

       COMPLETION:
       22/8/2026 21:30
    ========================================================= */


    const HOLD_START =
      new Date(
        "2026-08-21T21:30:00+08:00"
      );


    const HOLD_END =
      new Date(
        "2026-08-22T21:30:00+08:00"
      );


    const TOTAL_HOLD_MS =

      HOLD_END.getTime()

      -

      HOLD_START.getTime();



    /* =========================================================
       FORMAT TIME
       HH:MM:SS
    ========================================================= */

    function formatDuration(ms) {


      ms =
        Math.max(
          0,
          ms
        );


      const totalSeconds =
        Math.floor(
          ms / 1000
        );


      const hours =
        Math.floor(
          totalSeconds / 3600
        );


      const minutes =
        Math.floor(
          (
            totalSeconds % 3600
          )
          / 60
        );


      const seconds =
        totalSeconds % 60;


      return (

        String(hours)
          .padStart(
            2,
            "0"
          )

        +

        ":"

        +

        String(minutes)
          .padStart(
            2,
            "0"
          )

        +

        ":"

        +

        String(seconds)
          .padStart(
            2,
            "0"
          )

      );

    }



    /* =========================================================
       UPDATE HOLDING TIMER
    ========================================================= */

    function updateHoldingTimer() {


      const now =
        new Date();


      const holdingElement =
        document.getElementById(
          "holdingTime"
        );


      const remainingElement =
        document.getElementById(
          "remainingTime"
        );


      const panel =
        document.getElementById(
          "holdPanel"
        );


      const statusTitle =
        document.getElementById(
          "holdStatusTitle"
        );



      /* =======================================================
         BEFORE TEST START
      ======================================================= */

      if (
        now.getTime()
        <
        HOLD_START.getTime()
      ) {


        holdingElement.textContent =
          "00:00:00";


        remainingElement.textContent =
          "24:00:00";


        statusTitle.textContent =
          "Hydrotest Holding Period";


        panel.classList.remove(
          "completed"
        );


        return;

      }



      /* =======================================================
         TEST COMPLETED
      ======================================================= */

      if (
        now.getTime()
        >=
        HOLD_END.getTime()
      ) {


        holdingElement.textContent =

          formatDuration(
            TOTAL_HOLD_MS
          );


        remainingElement.textContent =
          "00:00:00";


        statusTitle.textContent =
          "Hydrotest Hold Completed";


        panel.classList.add(
          "completed"
        );


        return;

      }



      /* =======================================================
         TEST CURRENTLY HOLDING
      ======================================================= */

      const elapsed =

        now.getTime()

        -

        HOLD_START.getTime();


      const remaining =

        HOLD_END.getTime()

        -

        now.getTime();


      holdingElement.textContent =

        formatDuration(
          elapsed
        );


      remainingElement.textContent =

        formatDuration(
          remaining
        );


      statusTitle.textContent =
        "Hydrotest Holding Period";


      panel.classList.remove(
        "completed"
      );


    }


    updateHoldingTimer();


    setInterval(
      updateHoldingTimer,
      1000
    );



    /* =========================================================
       GOOGLE SHEET REFRESH
    ========================================================= */

    const REFRESH_TIME =
      60000;



    /* =========================================================
       GPS CONFIGURATION
    ========================================================= */

    const GPS = {


      spreadsheetId:

        "1OucgLhFiTqkeWiXJ0aI7j_tMsu9lVnqTxSK8y2AMCn4",


      gid:

        "1148130591",


      range:

        "A:Z",


      container:

        "gpsContainer",


      callback:

        "gpsResponse",


      hiddenColumns: [

        "INPUT"

      ]


    };



    /* =========================================================
       GPP4 CONFIGURATION
    ========================================================= */

    const GPP4 = {


      spreadsheetId:

        "1MKLNtFUQT8GiiVmyoXSkQjw7oPF2z44MO8gdCIUo5t0",


      gid:

        "0",


      range:

        "A:Z",


      container:

        "gpp4Container",


      callback:

        "gpp4Response",


      hiddenColumns: []


    };



    /* =========================================================
       LOAD GOOGLE SHEET
    ========================================================= */

    function loadSheet(config) {


      const query =

        "select * where A is not null";


      const tqx =

        `out:json;responseHandler:${config.callback}`;


      const url =

        "https://docs.google.com/spreadsheets/d/"

        +

        config.spreadsheetId

        +

        "/gviz/tq"

        +

        "?gid="

        +

        config.gid

        +

        "&range="

        +

        encodeURIComponent(
          config.range
        )

        +

        "&headers=1"

        +

        "&tqx="

        +

        encodeURIComponent(
          tqx
        )

        +

        "&tq="

        +

        encodeURIComponent(
          query
        )

        +

        "&_="

        +

        Date.now();



      const script =

        document.createElement(
          "script"
        );


      script.src =
        url;


      script.async =
        true;



      script.onerror =
        function () {


          const container =

            document.getElementById(
              config.container
            );


          container.innerHTML =

            '<div class="message">'

            +

            'Unable to load Google Sheet data'

            +

            '</div>';


        };



      script.onload =
        function () {


          setTimeout(

            function () {


              if (
                script.parentNode
              ) {

                script.remove();

              }


            },

            1000

          );


        };


      document.head.appendChild(
        script
      );


    }



    /* =========================================================
       CHECK CELL
    ========================================================= */

    function cellHasValue(cell) {


      if (!cell) {

        return false;

      }


      return !(

        cell.v === null

        ||

        cell.v === undefined

        ||

        cell.v === ""

      );


    }



    /* =========================================================
       GET DISPLAY VALUE
    ========================================================= */

    function getCellDisplayValue(cell) {


      if (!cell) {

        return "";

      }


      if (
        cell.f !== undefined
        &&
        cell.f !== null
      ) {

        return cell.f;

      }


      if (
        cell.v !== undefined
        &&
        cell.v !== null
      ) {

        return cell.v;

      }


      return "";

    }



    /* =========================================================
       AUTO SCROLL TO LATEST ROW
    ========================================================= */

    function scrollTableToBottom(
      container
    ) {


      requestAnimationFrame(

        function () {


          requestAnimationFrame(

            function () {


              container.scrollTop =

                container.scrollHeight

                -

                container.clientHeight;


            }

          );


        }

      );


    }



    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderTable(
      response,
      config
    ) {


      const container =

        document.getElementById(
          config.container
        );


      if (
        !response
        ||
        !response.table
      ) {


        container.innerHTML =

          '<div class="message">'

          +

          'No data available'

          +

          '</div>';


        return;

      }



      const columns =

        response.table.cols || [];


      const rows =

        response.table.rows || [];



      /* =======================================================
         HIDDEN COLUMNS
      ======================================================= */

      const hiddenColumns =

        (
          config.hiddenColumns || []
        )

        .map(

          function (name) {


            return String(name)

              .trim()

              .toUpperCase();


          }

        );



      /* =======================================================
         VISIBLE COLUMNS
      ======================================================= */

      const visibleColumns =
        [];


      columns.forEach(

        function (
          column,
          index
        ) {


          const columnName =

            String(
              column.label || ""
            )

            .trim()

            .toUpperCase();



          if (
            hiddenColumns.includes(
              columnName
            )
          ) {

            return;

          }



          const hasData =

            rows.some(

              function (row) {


                if (!row.c) {

                  return false;

                }


                return cellHasValue(
                  row.c[index]
                );


              }

            );



          if (
            columnName !== ""
            ||
            hasData
          ) {


            visibleColumns.push({


              column:
                column,


              index:
                index


            });


          }


        }

      );



      /* =======================================================
         NO DATA
      ======================================================= */

      if (
        visibleColumns.length === 0
      ) {


        container.innerHTML =

          '<div class="message">'

          +

          'No data available'

          +

          '</div>';


        return;

      }



      /* =======================================================
         TABLE
      ======================================================= */

      const table =

        document.createElement(
          "table"
        );



      /* =======================================================
         TABLE HEADER
      ======================================================= */

      const thead =

        document.createElement(
          "thead"
        );


      const headerRow =

        document.createElement(
          "tr"
        );


      visibleColumns.forEach(

        function (item) {


          const th =

            document.createElement(
              "th"
            );


          th.textContent =

            item.column.label || "";


          headerRow.appendChild(
            th
          );


        }

      );


      thead.appendChild(
        headerRow
      );


      table.appendChild(
        thead
      );



      /* =======================================================
         TABLE BODY
      ======================================================= */

      const tbody =

        document.createElement(
          "tbody"
        );


      let rowCount =
        0;


      let lastRowElement =
        null;



      rows.forEach(

        function (row) {


          const hasData =

            visibleColumns.some(

              function (item) {


                if (!row.c) {

                  return false;

                }


                return cellHasValue(
                  row.c[item.index]
                );


              }

            );


          if (!hasData) {

            return;

          }


          rowCount++;


          const tr =

            document.createElement(
              "tr"
            );


          visibleColumns.forEach(

            function (item) {


              const td =

                document.createElement(
                  "td"
                );


              const cell =

                row.c

                ? row.c[
                    item.index
                  ]

                : null;


              td.textContent =

                getCellDisplayValue(
                  cell
                );


              tr.appendChild(
                td
              );


            }

          );


          tbody.appendChild(
            tr
          );


          lastRowElement =
            tr;


        }

      );



      /* =======================================================
         NO READINGS
      ======================================================= */

      if (
        rowCount === 0
      ) {


        container.innerHTML =

          '<div class="message">'

          +

          'No readings available yet'

          +

          '</div>';


        return;

      }



      /* =======================================================
         LATEST ROW
      ======================================================= */

      if (
        lastRowElement
      ) {


        lastRowElement.classList.add(
          "latest-row"
        );


      }



      table.appendChild(
        tbody
      );


      container.innerHTML =
        "";


      container.appendChild(
        table
      );



      /* =======================================================
         SHOW LATEST READING
      ======================================================= */

      scrollTableToBottom(
        container
      );


    }



    /* =========================================================
       GPS CALLBACK
    ========================================================= */

    window.gpsResponse =

      function (response) {


        renderTable(
          response,
          GPS
        );


      };



    /* =========================================================
       GPP4 CALLBACK
    ========================================================= */

    window.gpp4Response =

      function (response) {


        renderTable(
          response,
          GPP4
        );


      };



    /* =========================================================
       REFRESH
    ========================================================= */

    function refreshAll() {


      loadSheet(
        GPS
      );


      loadSheet(
        GPP4
      );


    }



    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    refreshAll();



    /* =========================================================
       AUTO REFRESH EVERY 60 SEC
    ========================================================= */

    setInterval(

      refreshAll,

      REFRESH_TIME

    );


  </script>


</body>
